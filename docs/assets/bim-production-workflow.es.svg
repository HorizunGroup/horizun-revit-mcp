<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Horizun BIM Production Workflow</title>
  <desc id="desc">A five-stage workflow: identify model, audit, rehearse, apply verified change, receipt and review.</desc>
  <defs>
    <style>
      .bg{fill:#091522}.card{fill:#11283b;stroke:#2b5874;stroke-width:2}.safe{fill:#0d5b61;stroke:#39bdb4}.write{fill:#215777;stroke:#5ab8ea}.receipt{fill:#3f3b77;stroke:#aaa0ff}.text{font-family:Segoe UI,Arial,sans-serif;fill:#f3f8fc}.sub{font-family:Segoe UI,Arial,sans-serif;fill:#a8c1d0}.arrow{stroke:#6b9ab3;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b9ab3"/></marker>
  </defs>
  <rect class="bg" width="1200" height="420" rx="20"/>
  <text x="60" y="65" class="text" font-size="30" font-weight="700">BIM Production Mode</text>
  <text x="60" y="94" class="sub" font-size="17">Automatización BIM segura y verificable para modelos reales</text>
  <path class="arrow" d="M245 215 H290"/><path class="arrow" d="M465 215 H510"/><path class="arrow" d="M685 215 H730"/><path class="arrow" d="M905 215 H950"/>
  <g transform="translate(60 145)"><rect class="card" width="185" height="142" rx="14"/><text x="18" y="39" class="text" font-size="20" font-weight="700">1 · Identificar</text><text x="18" y="70" class="sub" font-size="15">Revit y documento</text><text x="18" y="93" class="sub" font-size="15">activo exacto</text><text x="18" y="121" fill="#72d8d0" font-size="14">horizun_health</text></g>
  <g transform="translate(290 145)"><rect class="card safe" width="175" height="142" rx="14"/><text x="18" y="39" class="text" font-size="20" font-weight="700">2 · Auditar</text><text x="18" y="70" class="sub" font-size="15">Hechos, hallazgos</text><text x="18" y="93" class="sub" font-size="15">y cobertura</text><text x="18" y="121" fill="#72d8d0" font-size="14">read_only</text></g>
  <g transform="translate(510 145)"><rect class="card safe" width="175" height="142" rx="14"/><text x="18" y="39" class="text" font-size="20" font-weight="700">3 · Ensayar</text><text x="18" y="70" class="sub" font-size="15">Alcance explícito</text><text x="18" y="93" class="sub" font-size="15">sin escribir</text><text x="18" y="121" fill="#72d8d0" font-size="14">dry_run</text></g>
  <g transform="translate(730 145)"><rect class="card write" width="175" height="142" rx="14"/><text x="18" y="39" class="text" font-size="20" font-weight="700">4 · Aplicar</text><text x="18" y="70" class="sub" font-size="15">Confirmación única</text><text x="18" y="93" class="sub" font-size="15">y relectura</text><text x="18" y="121" fill="#8fd6ff" font-size="14">typed write</text></g>
  <g transform="translate(950 145)"><rect class="card receipt" width="190" height="142" rx="14"/><text x="18" y="39" class="text" font-size="20" font-weight="700">5 · Evidencia</text><text x="18" y="70" class="sub" font-size="15">Resultado, tiempo,</text><text x="18" y="93" class="sub" font-size="15">recibo y revisión</text><text x="18" y="121" fill="#c4bdff" font-size="14">receipt ledger</text></g>
  <text x="60" y="350" class="sub" font-size="16">Una cobertura desconocida no se interpreta como aprobación. Python es un fallback con evidencia autorreportada, no host-verificada.</text>
</svg>

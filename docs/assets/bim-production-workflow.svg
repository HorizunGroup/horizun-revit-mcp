<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Horizun BIM Production Workflow</title>
  <desc id="desc">A five-stage workflow: identify model, audit, rehearse, apply verified change, receipt and review.</desc>
  <defs>
    <style>
      .bg{fill:#091522}.card{fill:#11283b;stroke:#2b5874;stroke-width:2}.safe{fill:#0d5b61;stroke:#39bdb4}.write{fill:#215777;stroke:#5ab8ea}.receipt{fill:#3f3b77;stroke:#aaa0ff}.text{font-family:Segoe UI,Arial,sans-serif;fill:#f3f8fc}.sub{font-family:Segoe UI,Arial,sans-serif;fill:#a8c1d0}.arrow{stroke:#6b9ab3;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b9ab3"/></marker>
  </defs>
  <rect class="bg" width="1200" height="420" rx="20"/>
  <text x="60" y="65" class="text" font-size="30" font-weight="700">BIM Production Mode</text>
  <text x="60" y="94" class="sub" font-size="17">Safe, verifiable BIM automation for models people deliver</text>
  <path class="arrow" d="M245 215 H290"/><path class="arrow" d="M465 215 H510"/><path class="arrow" d="M685 215 H730"/><path class="arrow" d="M905 215 H950"/>
  <g transform="translate(60 145)"><rect class="card" width="185" height="142" rx="14"/><text x="18" y="39" class="text" font-size="20" font-weight="700">1 · Identify</text><text x="18" y="70" class="sub" font-size="15">Revit and the exact</text><text x="18" y="93" class="sub" font-size="15">active document</text><text x="18" y="121" fill="#72d8d0" font-size="14">horizun_health</text></g>
  <g transform="translate(290 145)"><rect class="card safe" width="175" height="142" rx="14"/><text x="18" y="39" class="text" font-size="20" font-weight="700">2 · Audit</text><text x="18" y="70" class="sub" font-size="15">Facts, findings</text><text x="18" y="93" class="sub" font-size="15">and coverage</text><text x="18" y="121" fill="#72d8d0" font-size="14">read_only</text></g>
  <g transform="translate(510 145)"><rect class="card safe" width="175" height="142" rx="14"/><text x="18" y="39" class="text" font-size="20" font-weight="700">3 · Rehearse</text><text x="18" y="70" class="sub" font-size="15">Explicit scope,</text><text x="18" y="93" class="sub" font-size="15">nothing written</text><text x="18" y="121" fill="#72d8d0" font-size="14">dry_run</text></g>
  <g transform="translate(730 145)"><rect class="card write" width="175" height="142" rx="14"/><text x="18" y="39" class="text" font-size="20" font-weight="700">4 · Apply</text><text x="18" y="70" class="sub" font-size="15">One confirmation,</text><text x="18" y="93" class="sub" font-size="15">then a re-read</text><text x="18" y="121" fill="#8fd6ff" font-size="14">typed write</text></g>
  <g transform="translate(950 145)"><rect class="card receipt" width="190" height="142" rx="14"/><text x="18" y="39" class="text" font-size="20" font-weight="700">5 · Evidence</text><text x="18" y="70" class="sub" font-size="15">Outcome, timing,</text><text x="18" y="93" class="sub" font-size="15">receipt and review</text><text x="18" y="121" fill="#c4bdff" font-size="14">receipt ledger</text></g>
  <text x="60" y="350" class="sub" font-size="16">Unknown coverage is never read as approval. Python is a fallback carrying self-reported evidence, not host-verified evidence.</text>
</svg>

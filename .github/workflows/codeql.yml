name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  # CodeQL v4 queries the workflow run while publishing its SARIF results.
  # Declaring any permissions makes omitted scopes "none", so retain this
  # read-only scope explicitly.
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Only the public repository. The analysis itself runs anywhere, but
    # publishing its SARIF needs code scanning enabled, and that is an
    # Advanced Security feature the private mirrors do not have — so there
    # every run reached the upload and died on "Code scanning is not enabled
    # for this repository", turning a working analysis into a red check.
    # Skipped, not failed, is the honest outcome on those mirrors.
    if: github.repository == 'HorizunGroup/horizun-revit-mcp'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4

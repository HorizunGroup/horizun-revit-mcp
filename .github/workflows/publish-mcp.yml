name: publish-mcp-registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate server metadata
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate .mcp/server.json

      - name: Authenticate with the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish Horizun Revit MCP metadata
        run: ./mcp-publisher publish .mcp/server.json

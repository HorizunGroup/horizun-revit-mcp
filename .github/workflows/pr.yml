# Pull-request validation runs only on disposable GitHub-hosted runners.
#
# Do not merge this with ci.yml: that workflow contains persistent self-hosted
# Revit jobs and the release signing path. A condition inside a PR-controlled
# workflow is not a trust boundary because the PR can edit the condition.
name: pull-request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore src/Horizun.Server/Horizun.Server.csproj --locked-mode
          dotnet restore tests/Horizun.Core.Tests/Horizun.Core.Tests.csproj --locked-mode
          dotnet restore tests/Horizun.Server.Tests/Horizun.Server.Tests.csproj --locked-mode

      - name: Build the MCP server (warnings are errors)
        run: dotnet build src/Horizun.Server/Horizun.Server.csproj -c Release --no-restore -warnaserror

      - name: Test core behavior
        run: dotnet test tests/Horizun.Core.Tests/Horizun.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/tests

      - name: Test server protocol
        run: dotnet test tests/Horizun.Server.Tests/Horizun.Server.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=server.trx" --results-directory artifacts/tests

      - name: Enforce the workflow trust boundary
        shell: pwsh
        run: pwsh scripts/workflow-security.tests.ps1

      - name: Audit dependencies for known vulnerabilities
        env:
          EnableWindowsTargeting: true
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            src/Horizun.Server/Horizun.Server.csproj \
            src/Horizun.Revit/Horizun.Revit.csproj \
            tests/Horizun.Core.Tests/Horizun.Core.Tests.csproj \
            tests/Horizun.Server.Tests/Horizun.Server.Tests.csproj; do
            if ! out=$(dotnet list "$p" package --vulnerable --include-transitive 2>&1); then
              echo "$out"
              echo "::error::dependency audit could not run for $p"
              exit 1
            fi
            echo "$out"
            if echo "$out" | grep -q "has the following vulnerable packages"; then
              echo "::error::vulnerable packages in $p"
              exit 1
            fi
          done

      - name: Test deployment scripts and public metadata
        shell: pwsh
        run: |
          pwsh scripts/install-arguments.tests.ps1
          pwsh scripts/deployment-security.tests.ps1
          pwsh scripts/install-result.tests.ps1
          pwsh scripts/install-completion.tests.ps1
          pwsh scripts/verify-install.tests.ps1
          pwsh scripts/uninstall-cleanup.tests.ps1
          pwsh scripts/manifest-integrity.tests.ps1
          pwsh scripts/register-client.tests.ps1
          pwsh scripts/scan-sensitive.tests.ps1
          pwsh scripts/server-update.tests.ps1
          pwsh scripts/public-consistency.tests.ps1
          pwsh scripts/python-permission.tests.ps1

      - name: Scan for sensitive names
        shell: pwsh
        run: pwsh scripts/scan-sensitive.ps1 -Json artifacts/scan/sensitive.json

      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pull-request-diagnostics
          path: |
            artifacts/tests
            artifacts/scan

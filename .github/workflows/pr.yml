# Pull-request validation runs only on disposable GitHub-hosted runners.
#
# Do not merge this with ci.yml: that workflow contains persistent self-hosted
# Revit jobs and the release signing path. A condition inside a PR-controlled
# workflow is not a trust boundary because the PR can edit the condition.
name: pull-request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # Keep the build SDK exact and also install the pinned runtime used
          # when the wire tests execute the framework-dependent build output.
          dotnet-version: |
            10.0.400
            8.0.424

      - name: Restore
        run: |
          dotnet restore src/Horizun.Server/Horizun.Server.csproj --locked-mode
          dotnet restore tests/Horizun.Core.Tests/Horizun.Core.Tests.csproj --locked-mode
          dotnet restore tests/Horizun.Server.Tests/Horizun.Server.Tests.csproj --locked-mode

      - name: Build the MCP server (warnings are errors)
        run: dotnet build src/Horizun.Server/Horizun.Server.csproj -c Release --no-restore -warnaserror

      - name: Test core behavior
        run: dotnet test tests/Horizun.Core.Tests/Horizun.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/tests

      - name: Test server protocol
        run: dotnet test tests/Horizun.Server.Tests/Horizun.Server.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=server.trx" --results-directory artifacts/tests

      - name: Audit dependencies for known vulnerabilities
        env:
          EnableWindowsTargeting: true
        shell: pwsh
        run: pwsh scripts/audit-dependencies.ps1 -SkipRevit

      - name: Scan for sensitive names
        shell: pwsh
        run: pwsh scripts/scan-sensitive.ps1 -Json artifacts/scan/sensitive.json

      - name: Publish diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pull-request-diagnostics
          path: |
            artifacts/tests
            artifacts/scan

  windows-deployment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.400
            8.0.424

      - name: Test deployment, installation and public metadata
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/workflow-security.tests.ps1'
            'scripts/deployment-security.tests.ps1'
            'scripts/install-arguments.tests.ps1'
            'scripts/install-result.tests.ps1'
            'scripts/install-completion.tests.ps1'
            'scripts/verify-install.tests.ps1'
            'scripts/uninstall-cleanup.tests.ps1'
            'scripts/manifest-integrity.tests.ps1'
            'scripts/register-client.tests.ps1'
            'scripts/scan-sensitive.tests.ps1'
            'scripts/server-update.tests.ps1'
            'scripts/public-consistency.tests.ps1'
            'scripts/python-permission.tests.ps1'
            'scripts/python-stdlib-audit.tests.ps1'
            'scripts/install-status.tests.ps1'
            'scripts/dwg-state.tests.ps1'
            'scripts/live-paths.tests.ps1'
            'scripts/inventory.tests.ps1'
            'scripts/provenance.tests.ps1'
            'scripts/structural-state.tests.ps1'
            'scripts/parameter-shadowing.tests.ps1'
            'scripts/integrations.tests.ps1'
            'scripts/mcpb-portability.tests.ps1'
          )
          foreach ($script in $scripts) {
            Write-Host "==> $script"
            pwsh -NoProfile -File $script
            if ($LASTEXITCODE -ne 0) { throw "$script failed with exit code $LASTEXITCODE" }
          }
          pwsh -NoProfile -File scripts/audit-dependencies.ps1
          if ($LASTEXITCODE -ne 0) { throw "dependency audit failed with exit code $LASTEXITCODE" }

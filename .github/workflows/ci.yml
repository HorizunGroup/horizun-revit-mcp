# Horizun MCP - continuous integration.
#
# THE HONEST BOUNDARY, stated once so nothing below has to hedge.
#
# A hosted runner has no Revit, so it has no RevitAPI.dll. The add-in cannot be
# compiled here for any year, and no amount of CI configuration changes that.
# Everything that does NOT need Revit is proved here, on every push. Everything
# that DOES is declared as a job that runs only on a self-hosted runner with
# Revit installed, and is skipped - visibly - when there is none.
#
# A skipped job that says why is worth more than a green tick that covered less
# than it appeared to.
name: ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

# SECURITY BOUNDARY: this workflow is deliberately push/tag only. It contains
# jobs that execute repository code on persistent self-hosted Revit machines and
# a release path that can use the signing key. Pull requests run only through
# pr.yml, which contains hosted-runner jobs and no route to this workflow.

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Everything provable without Revit. This is the gate for merging.
  # ---------------------------------------------------------------------------
  revit-free:
    runs-on: ubuntu-latest    # the Revit-free surface is plain net8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # 10.0.400 is the repository SDK. 8.0.424 contributes the exact
          # Microsoft.NETCore.App 8.0.30 runtime that the framework-dependent
          # wire-test executable requires; the shipped server is self-contained.
          dotnet-version: |
            10.0.400
            8.0.424

      # Restore before build, explicitly, so a build failure is a build failure
      # and a restore failure says so.
      # Found in the field 2026-08-04: a v0.6.1 tag shipped while both .csproj still
      # said 0.6.0. In a project that stamps commit + SHA-256 into every binary, a
      # version number that disagrees with its own tag is the one identity nobody
      # verified. Every project inherits one value; a tagged build must match it.
      - name: Product version matches the tag, when there is one
        shell: bash
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          test -n "$version" || { echo "::error::Directory.Build.props has no product Version"; exit 1; }
          echo "Horizun=$version ref=$GITHUB_REF"
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="${GITHUB_REF#refs/tags/v}"
              if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$|^[0-9]+\.[0-9]+\.[0-9]+-(preview|validation)\.[1-9][0-9]*$ ]]; then
                echo "::error::Release tags must be vX.Y.Z, vX.Y.Z-preview.N or vX.Y.Z-validation.N."
                exit 1
              fi
              case "$tag" in
                *-validation.*)
                  base="${tag%%-*}"
                  if [ "$base" != "${version%%-*}" ]; then
                    echo "::error::Validation tag v$tag has base $base but <Version> is $version."
                    exit 1
                  fi ;;
                *)
                  if [ "$tag" != "$version" ]; then
                    echo "::error::Installable tag v$tag must exactly match <Version> $version, including preview suffix."
                    exit 1
                  fi ;;
              esac ;;
          esac

      - name: Tagged releases require the live Revit gate
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-validation.')
        shell: bash
        run: |
          if [ "${{ vars.HAS_REVIT_RUNNER }}" != "true" ]; then
            echo "::error::A release tag cannot pass without the self-hosted Revit runner. Publish a preview from a non-tag build or restore the full live gate first."
            exit 1
          fi
          if [ -z "${{ vars.REVIT_RUNNER_GROUP }}" ] || [ -z "${{ vars.SIGNING_RUNNER_GROUP }}" ]; then
            echo "::error::Stable releases require explicit REVIT_RUNNER_GROUP and SIGNING_RUNNER_GROUP repository variables."
            exit 1
          fi
          if [ "${{ vars.REVIT_RUNNER_GROUP }}" = "${{ vars.SIGNING_RUNNER_GROUP }}" ]; then
            echo "::error::The signing runner group must be distinct from the Revit integration runner group."
            exit 1
          fi
          if [ "${{ vars.SIGNPATH_SELF_HOSTED_ORIGIN_APPROVED }}" != "true" ]; then
            echo "::error::SignPath Foundation OSS origin rules require hosted build jobs by default. This Revit build needs licensed APIs on a self-hosted runner; stable signing remains blocked until SignPath explicitly approves that origin and SIGNPATH_SELF_HOSTED_ORIGIN_APPROVED=true records the external decision."
            exit 1
          fi
          missing=()
          [ -n "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ] || missing+=(SIGNPATH_ORGANIZATION_ID)
          [ -n "${{ vars.SIGNPATH_PROJECT_SLUG }}" ] || missing+=(SIGNPATH_PROJECT_SLUG)
          [ -n "${{ vars.SIGNPATH_PAYLOAD_POLICY_SLUG }}" ] || missing+=(SIGNPATH_PAYLOAD_POLICY_SLUG)
          [ -n "${{ vars.SIGNPATH_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG }}" ] || missing+=(SIGNPATH_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG)
          [ -n "${{ vars.SIGNPATH_INSTALLER_POLICY_SLUG }}" ] || missing+=(SIGNPATH_INSTALLER_POLICY_SLUG)
          [ -n "${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}" ] || missing+=(SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG)
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::SignPath project configuration is incomplete: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Restore
        run: |
          dotnet restore src/Horizun.Server/Horizun.Server.csproj --locked-mode
          dotnet restore tests/Horizun.Core.Tests/Horizun.Core.Tests.csproj --locked-mode
          dotnet restore tests/Horizun.Server.Tests/Horizun.Server.Tests.csproj --locked-mode

      # Warnings as errors HERE and not in the csproj: a developer mid-change
      # should not be blocked by a warning, and main should not accumulate them.
      - name: Build the MCP server (warnings are errors)
        run: dotnet build src/Horizun.Server/Horizun.Server.csproj -c Release --no-restore -warnaserror

      - name: Test - honesty arithmetic, coverage rules, request ownership
        run: dotnet test tests/Horizun.Core.Tests/Horizun.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/tests

      # Named separately because these are the ones that answer "did the two
      # halves drift" and "can two answers collide on one id" - the failures
      # that are invisible in a single lumped result line.
      - name: Test - contract drift, wire protocol, multi-instance discovery
        run: dotnet test tests/Horizun.Server.Tests/Horizun.Server.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=server.trx" --results-directory artifacts/tests

      - name: Audit dependencies for known vulnerabilities
        # The audit includes the Revit project. It does not build Revit on this
        # Linux runner, but MSBuild must be allowed to evaluate its Windows TFM.
        env:
          EnableWindowsTargeting: true
        shell: pwsh
        run: pwsh scripts/audit-dependencies.ps1

      - name: Whitespace and line-ending hygiene
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          else
            git diff --check $(git hash-object -t tree /dev/null) HEAD
          fi

      # Client, project and model names. The STRUCTURAL rules run here and need no
      # wordlist - a home directory with a real name in it, an e-mail address, a
      # cloud project path. The NAME check needs the wordlist, which is
      # deliberately not in this repository (client and project names never enter it), so on a
      # hosted runner it reports NOT RUN rather than passing quietly. The
      # self-hosted release gate is where -RequireTerms makes that a failure.
      - name: Scan for client, project and model names
        shell: pwsh
        run: pwsh scripts/scan-sensitive.ps1 -Json artifacts/scan/sensitive.json

      - name: Publish the client-name scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sensitive-scan
          path: artifacts/scan

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: artifacts/tests

  # ---------------------------------------------------------------------------
  # Deployment and installer tests need real Windows semantics: junctions,
  # Windows PowerShell, Authenticode and Start-Process options. Running them on
  # Linux used to produce terminating errors that a later child pwsh invocation
  # masked. Keep this disposable and Revit-free, but make every child exit code
  # part of the gate.
  # ---------------------------------------------------------------------------
  windows-deployment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.400
            8.0.424

      - name: Test deployment, installation and public metadata
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/workflow-security.tests.ps1'
            'scripts/deployment-security.tests.ps1'
            'scripts/install-arguments.tests.ps1'
            'scripts/install-result.tests.ps1'
            'scripts/install-completion.tests.ps1'
            'scripts/verify-install.tests.ps1'
            'scripts/uninstall-cleanup.tests.ps1'
            'scripts/manifest-integrity.tests.ps1'
            'scripts/register-client.tests.ps1'
            'scripts/scan-sensitive.tests.ps1'
            'scripts/server-update.tests.ps1'
            'scripts/public-consistency.tests.ps1'
            'scripts/python-permission.tests.ps1'
            'scripts/python-stdlib-audit.tests.ps1'
          )
          foreach ($script in $scripts) {
            Write-Host "==> $script"
            pwsh -NoProfile -File $script
            if ($LASTEXITCODE -ne 0) { throw "$script failed with exit code $LASTEXITCODE" }
          }

  # ---------------------------------------------------------------------------
  # The add-in, per Revit year. Needs a machine with Revit; skipped otherwise,
  # and the skip is the point - it is visible rather than assumed.
  # ---------------------------------------------------------------------------
  revit-addin:
    if: ${{ vars.HAS_REVIT_RUNNER == 'true' && vars.REVIT_RUNNER_GROUP != '' }}
    runs-on:
      group: ${{ vars.REVIT_RUNNER_GROUP }}
      labels: [self-hosted, windows, revit]
    env:
      # A persistent runner's global package cache is mutable state outside the
      # locked graph. Give each run/year a fresh extraction root so an old job
      # cannot replace a DLL under an otherwise-correct packages.lock.json.
      # runner.* is unavailable while GitHub evaluates a job-level env block.
      # The run/year-qualified directory is still fresh and checkout cleans it.
      NUGET_PACKAGES: ${{ github.workspace }}\.horizun-nuget-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.year }}
    strategy:
      fail-fast: false
      # One Windows desktop can host one unattended Revit session safely. Running
      # two matrix rows together would either make target selection ambiguous or
      # make one row kill/overwrite the other's fixture state.
      max-parallel: 1
      matrix:
        year: [2023, 2024, 2025, 2026, 2027]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the add-in for Revit ${{ matrix.year }} against its own RevitAPI
        shell: pwsh
        run: |
          dotnet build src/Horizun.Revit/Horizun.Revit.csproj -c Release -p:RevitYear=${{ matrix.year }} -p:RestoreLockedMode=true -warnaserror

      # The framework is re-read from the produced bytes rather than trusted from
      # the build log: bin is shared across years and a leftover is invisible.
      - name: Verify the artifact is the runtime that year hosts
        shell: pwsh
        run: |
          $dll = "src/Horizun.Revit/bin/Release/Horizun.Revit.dll"
          $t = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($dll))
          $year = ${{ matrix.year }}
          $want = if ($year -le 2024) { '.NETFramework,Version=v4.8' }
                  elseif ($year -ge 2027) { '.NETCoreApp,Version=v10.0' }
                  else { '.NETCoreApp,Version=v8.0' }
          if ($t -notlike "*$want*") { throw "Revit $year artifact is not $want" }
          Write-Host "Revit $year -> $want, sha $((Get-FileHash $dll -Algorithm SHA256).Hash.Substring(0,16))"

  # ---------------------------------------------------------------------------
  # Build the unsigned stage on the isolated machine that owns the licensed
  # Revit APIs. This job never receives SignPath credentials. Its only hand-off
  # is the immutable GitHub artifact id consumed by the hosted signing job.
  # ---------------------------------------------------------------------------
  build-stage:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-validation.') && vars.HAS_REVIT_RUNNER == 'true' && vars.SIGNING_RUNNER_GROUP != '' && vars.SIGNING_RUNNER_GROUP != vars.REVIT_RUNNER_GROUP }}
    needs: [revit-free, windows-deployment, revit-addin]
    outputs:
      payload-artifact-id: ${{ steps.signpath-payload-input.outputs.artifact-id }}
    runs-on:
      group: ${{ vars.SIGNING_RUNNER_GROUP }}
      labels: [self-hosted, windows, revit, signing]
    env:
      NUGET_PACKAGES: ${{ github.workspace }}\.horizun-nuget-${{ github.run_id }}-${{ github.run_attempt }}-build-stage
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and scan the exact public projection
        shell: pwsh
        run: pwsh scripts/validate-public-projection.ps1 -Output dist/public/ci

      - name: Build and stage every supported year
        shell: pwsh
        run: pwsh scripts/pack.ps1 -SkipInstaller

      # The stage is validated on its own, because "pack did not throw" and "the
      # payload is correct" are different claims.
      - name: Validate the staged payload
        shell: pwsh
        run: |
          $stage = "dist/stage"
          $doc = Get-Content "$stage/manifest.json" -Raw | ConvertFrom-Json
          if ($doc.Schema -ne 2) { throw "expected manifest schema 2, got '$($doc.Schema)'" }

          # A package must name ONE commit, and it must be a commit these binaries
          # actually are. -dirty means the sha names something else.
          if (-not $doc.Commit -or $doc.Commit -eq 'unknown') { throw "the manifest names no commit" }
          if ($doc.Commit.Length -ne 40) { throw "the manifest's commit is not a full sha: $($doc.Commit)" }
          if (-not $doc.CleanTree) { throw "packaged from a DIRTY tree - the commit in this manifest is not what these binaries are" }

          # The server is half of what gets installed, and the half the manifest
          # used to omit entirely.
          $srvSha = (Get-FileHash "$stage/$($doc.Server.File)" -Algorithm SHA256).Hash.ToLower()
          if ($srvSha -ne $doc.Server.Sha256) { throw "server: manifest says $($doc.Server.Sha256), file is $srvSha" }
          if ($doc.Server.Sha256.Length -ne 64) { throw "the server hash is truncated - a prefix identifies nothing" }
          foreach ($helper in 'register-client.ps1','verify-clients.ps1','verify-install.ps1','complete-install.ps1','stop-installed-server.ps1','hz-call.ps1','uninstall-cleanup.ps1','toml-section.lib.ps1') {
            if (-not (Test-Path "$stage/server/client-tools/$helper")) {
              throw "installer client helper is missing: $helper"
            }
          }

          if ($doc.Plugins.Count -lt 1) { throw "the manifest has no plugin payloads" }
          $seen = @{}
          foreach ($e in $doc.Plugins) {
            $dll = "$stage/plugin/$($e.Year)/Horizun.Revit.dll"
            if (-not (Test-Path $dll)) { throw "manifest names $($e.Year) but its payload is missing" }
            $sha = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $e.Sha256) { throw "$($e.Year): manifest says $($e.Sha256), file is $sha" }
            if ($e.Sha256.Length -ne 64) { throw "$($e.Year): truncated hash - a 16-character prefix verifies nothing" }
            # Two years sharing a hash means one was built against the wrong API -
            # the exact defect the per-year build exists to remove.
            if ($seen.ContainsKey($sha)) { throw "$($e.Year) and $($seen[$sha]) are the SAME binary" }
            $seen[$sha] = $e.Year
            foreach ($needed in 'IronPython.dll','Newtonsoft.Json.dll') {
              if (-not (Test-Path "$stage/plugin/$($e.Year)/$needed")) { throw "$($e.Year): $needed missing" }
            }
          }

          # All five, or the package silently drops a Revit generation and the
          # symptom lands on whoever opens that year weeks later.
          $missing = @(2023,2024,2025,2026,2027 | Where-Object { $_ -notin $doc.Plugins.Year })
          if ($missing.Count -gt 0) { throw "no payload for $($missing -join ', ') - this runner is missing those Revit versions" }

          Write-Host "validated commit $($doc.Commit), server + $($doc.Plugins.Count) per-year payloads, all distinct, full hashes"

      - name: Prove an active CLI update stops only the installed server path
        shell: pwsh
        run: pwsh scripts/server-update.tests.ps1 -RequireWindows

      # The full check, with the wordlist that lives on this runner. -RequireTerms
      # makes a MISSING wordlist a failure: at a release gate, "the name check did
      # not run" must not be indistinguishable from "it passed".
      - name: Scan for client names, with the wordlist (release gate)
        shell: pwsh
        run: pwsh scripts/scan-sensitive.ps1 -RequireTerms -Json artifacts/scan/sensitive-release.json

      - name: Inventory what ships (fails on an unidentified licence)
        shell: pwsh
        run: |
          pwsh scripts/sbom.ps1
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed ($LASTEXITCODE)" }
          pwsh scripts/sbom.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "SBOM tests failed ($LASTEXITCODE)" }
          pwsh scripts/version-consistency.tests.ps1 -RequireStage
          if ($LASTEXITCODE -ne 0) { throw "staged version consistency failed ($LASTEXITCODE)" }

      - name: Audit the exact redistributed IronPython standard library
        shell: pwsh
        run: |
          pwsh scripts/audit-python-stdlib.ps1 -StageRoot dist/stage -Json dist/python-stdlib-audit.json -Sarif dist/python-stdlib-audit.sarif
          if ($LASTEXITCODE -ne 0) { throw "Python stdlib audit failed ($LASTEXITCODE)" }

      - name: Validate the SBOM with the pinned official CycloneDX CLI
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'cyclonedx-win-x64.exe'
          $url = 'https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-win-x64.exe'
          $expected = 'b1c00dbb40e628ec8c1252771871341ac4d4aaf032f832d83bd22cb2b1d258ae'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $tool
          $actual = (Get-FileHash $tool -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "CycloneDX CLI checksum mismatch: $actual" }
          & $tool validate --input-file dist/sbom.json --input-format json --input-version v1_6 --fail-on-errors
          if ($LASTEXITCODE -ne 0) { throw "CycloneDX validation failed ($LASTEXITCODE)" }

      # SignPath consumes the immutable GitHub artifact, not a filesystem path
      # chosen by repository code. This is request 1 of 2: Revit loads these
      # seven inner binaries after Setup extracts them, so signing only Setup
      # would leave the actual code unsigned.
      - name: Upload the unsigned payload for SignPath
        id: signpath-payload-input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-payload-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/stage
          if-no-files-found: error
          retention-days: 1

  # The API token exists only in this protected, disposable hosted job. The
  # self-hosted producer is referenced by immutable artifact id, never by path
  # or artifact name.
  sign-payload:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-validation.')
    needs: build-stage
    environment: release-signing
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    outputs:
      signed-payload-artifact-id: ${{ steps.signed-payload.outputs.artifact-id }}
      signing-request-url: ${{ steps.signpath-payload.outputs.signing-request-web-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Sign the staged Horizun binaries with SignPath Foundation
        id: signpath-payload
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_PAYLOAD_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build-stage.outputs.payload-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signpath-payload-output

      - name: Verify and adopt the exact signed payload
        shell: pwsh
        run: |
          $manifests = @(Get-ChildItem -LiteralPath 'dist/signpath-payload-output' -Filter manifest.json -File -Recurse)
          if ($manifests.Count -ne 1) {
            throw "SignPath payload output must contain exactly one manifest.json; found $($manifests.Count)."
          }
          $signedRoot = $manifests[0].Directory.FullName
          $original = Get-Content -LiteralPath $manifests[0].FullName -Raw | ConvertFrom-Json
          . ./scripts/horizun-deploy.lib.ps1

          # The manifest deliberately aggregates each plugin's Python stdlib into
          # a path-and-hash digest. Compare with the same canonical inventory
          # function instead of flattening only the human-readable entries.
          $expectedRoot = @('Horizun.addin','manifest.json','plugin','server')
          $actualRoot = @(Get-ChildItem -LiteralPath $signedRoot -Force | ForEach-Object Name | Sort-Object)
          if (@(Compare-Object ($expectedRoot | Sort-Object) $actualRoot).Count) {
            throw "SignPath changed the stage root inventory."
          }

          $serverListing = Get-HorizunPayloadListing (Join-Path $signedRoot 'server')
          $serverExpected = @($original.Server.Payload | ForEach-Object { "$($_.Path)".Replace('\','/') } | Sort-Object)
          $serverActual = @($serverListing.Files | ForEach-Object { "$($_.Path)".Replace('\','/') } | Sort-Object)
          if (@(Compare-Object $serverExpected $serverActual).Count -or $serverListing.StdLibFiles -ne 0) {
            throw 'SignPath changed the server payload inventory.'
          }

          $expectedYears = @($original.Plugins | ForEach-Object { "$($_.Year)" } | Sort-Object)
          $actualYears = @(Get-ChildItem -LiteralPath (Join-Path $signedRoot 'plugin') -Directory -Force | ForEach-Object Name | Sort-Object)
          if (@(Compare-Object $expectedYears $actualYears).Count) {
            throw 'SignPath changed the plugin-year inventory.'
          }
          foreach ($plugin in @($original.Plugins)) {
            $listing = Get-HorizunPayloadListing (Join-Path $signedRoot "plugin/$($plugin.Year)")
            $expected = @($plugin.Payload | ForEach-Object { "$($_.Path)".Replace('\','/') } | Sort-Object)
            $actual = @($listing.Files | ForEach-Object { "$($_.Path)".Replace('\','/') } | Sort-Object)
            if (@(Compare-Object $expected $actual).Count -or
                [int]$listing.StdLibFiles -ne [int]$plugin.StdLibFiles -or
                "$($listing.StdLibDigest)" -ne "$($plugin.StdLibDigest)" -or
                [int]$plugin.Files -ne ([int]$listing.FileCount + [int]$listing.StdLibFiles)) {
              throw "SignPath changed the plugin $($plugin.Year) payload inventory."
            }
          }

          $expectedOwn = @('server/horizun-mcp.exe','server/horizun-mcp.dll') + `
            @(2023,2024,2025,2026,2027 | ForEach-Object { "plugin/$_/Horizun.Revit.dll" })
          function Assert-UnchangedEntry([string]$relative, [string]$sha256) {
            $relative = $relative.Replace('\','/')
            if ($expectedOwn -contains $relative) { return }
            $path = Join-Path $signedRoot $relative
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne "$sha256".ToLowerInvariant()) {
              throw "SignPath changed non-owned payload byte: $relative"
            }
          }
          foreach ($entry in @($original.Server.Payload)) {
            Assert-UnchangedEntry "server/$($entry.Path)" $entry.Sha256
          }
          foreach ($plugin in @($original.Plugins)) {
            foreach ($entry in @($plugin.Payload)) {
              Assert-UnchangedEntry "plugin/$($plugin.Year)/$($entry.Path)" $entry.Sha256
            }
          }
          if ($original.AddinManifest) {
            Assert-UnchangedEntry 'Horizun.addin' $original.AddinManifest.Sha256
          }

          $actualOwn = @(Get-HorizunOwnBinaries $signedRoot | ForEach-Object {
            $_.Substring($signedRoot.Length).TrimStart([char[]]@('\','/')).Replace('\','/')
          } | Sort-Object)
          if (@(Compare-Object ($expectedOwn | Sort-Object) $actualOwn).Count) {
            throw "SignPath output does not contain the exact seven owned binaries."
          }
          foreach ($path in @(Get-HorizunOwnBinaries $signedRoot)) {
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate -or
                $sig.SignerCertificate.Subject -notmatch '(?i)SignPath Foundation') {
              throw "SignPath payload is not publicly trusted, timestamped and Foundation-signed: $path ($($sig.Status))."
            }
          }

          $stage = Join-Path (Resolve-Path dist).Path 'stage'
          if (Test-Path -LiteralPath $stage) { throw 'Hosted signing workspace unexpectedly already contains dist/stage.' }
          Move-Item -LiteralPath $signedRoot -Destination $stage
          $doc = Update-HorizunManifestToStage $stage
          $mismatch = @(Test-HorizunStageMatchesManifest $stage)
          if ($mismatch.Count) { throw "Signed stage does not match refreshed manifest: $($mismatch -join '; ')" }
          $badSignatureRecords = @($doc.Signature.Files | Where-Object { -not $_.Signed -or $_.Status -ne 'Valid' -or -not $_.Timestamped })
          if (-not $doc.Signed -or $doc.Signature.SignerSubject -notmatch '(?i)SignPath Foundation' -or $badSignatureRecords.Count) {
            throw 'Refreshed manifest does not record the exact valid SignPath-signed payload.'
          }

      - name: Upload the verified signed payload
        id: signed-payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/stage
          if-no-files-found: error
          retention-days: 1

  # The installer must embed the already-signed stage, so compilation returns to
  # the isolated Windows/Revit build runner. No environment or SignPath secret is
  # attached to this job.
  compile-installer:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-validation.')
    needs: sign-payload
    runs-on:
      group: ${{ vars.SIGNING_RUNNER_GROUP }}
      labels: [self-hosted, windows, revit, signing]
    permissions:
      actions: read
      contents: read
    outputs:
      installer-artifact-id: ${{ steps.signpath-installer-input.outputs.artifact-id }}
      package-support-artifact-id: ${{ steps.package-support.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the exact signed payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.sign-payload.outputs.signed-payload-artifact-id }}
          path: dist/stage
          merge-multiple: true

      - name: Revalidate the signed stage before compilation
        shell: pwsh
        run: |
          . ./scripts/horizun-deploy.lib.ps1
          $mismatch = @(Test-HorizunStageMatchesManifest 'dist/stage')
          if ($mismatch.Count) { throw "Downloaded signed stage does not match its manifest: $($mismatch -join '; ')" }
          $doc = Get-Content 'dist/stage/manifest.json' -Raw | ConvertFrom-Json
          if (-not $doc.Signed -or $doc.Signature.SignerSubject -notmatch '(?i)SignPath Foundation') {
            throw 'Downloaded stage has no valid SignPath manifest identity.'
          }

      - name: Regenerate signed-stage evidence
        shell: pwsh
        run: |
          pwsh scripts/sbom.ps1
          if ($LASTEXITCODE -ne 0) { throw "signed-stage SBOM generation failed ($LASTEXITCODE)" }
          pwsh scripts/sbom.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "signed-stage SBOM tests failed ($LASTEXITCODE)" }
          pwsh scripts/audit-python-stdlib.ps1 -StageRoot dist/stage -Json dist/python-stdlib-audit.json -Sarif dist/python-stdlib-audit.sarif
          if ($LASTEXITCODE -ne 0) { throw "signed-stage Python stdlib audit failed ($LASTEXITCODE)" }

      - name: Compile the installer from the signed payload
        shell: pwsh
        run: |
          pwsh scripts/pack.ps1 -InstallerOnly
          if ($LASTEXITCODE -ne 0) { throw "installer compilation failed ($LASTEXITCODE)" }
          pwsh scripts/version-consistency.tests.ps1 -RequireStage -RequireInstaller
          if ($LASTEXITCODE -ne 0) { throw "installer version consistency failed ($LASTEXITCODE)" }

      - name: Archive the complete signed stage with its build timestamps
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $source = (Resolve-Path 'dist/stage').Path
          $archive = Join-Path (Resolve-Path 'dist').Path 'stage.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $source,
            $archive,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          if (-not (Test-Path $archive)) { throw 'stage.zip was not created' }

      - name: Upload the unsigned installer for SignPath
        id: signpath-installer-input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-installer-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload the immutable package support files
        id: package-support
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-support-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/stage.zip
            dist/stage/manifest.json
            dist/sbom.json
            dist/python-stdlib-audit.json
            dist/python-stdlib-audit.sarif
          if-no-files-found: error
          retention-days: 1

  # Request 2 is independently protected and hosted. The token is again scoped
  # to this disposable job and never crosses into the installer compiler.
  sign-installer:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-validation.')
    needs: compile-installer
    environment: release-signing
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    outputs:
      signed-installer-artifact-id: ${{ steps.signed-installer.outputs.artifact-id }}
      signing-request-url: ${{ steps.signpath-installer.outputs.signing-request-web-url }}
    steps:
      - name: Sign the installer with SignPath Foundation
        id: signpath-installer
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_INSTALLER_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.compile-installer.outputs.installer-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signpath-installer-output

      - name: Verify the exact signed installer
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem -LiteralPath 'dist/signpath-installer-output' -Filter '*setup.exe' -File -Recurse)
          $all = @(Get-ChildItem -LiteralPath 'dist/signpath-installer-output' -File -Recurse)
          if ($signed.Count -ne 1 -or $all.Count -ne 1) {
            throw "SignPath installer output must contain exactly one Setup; found setup=$($signed.Count), files=$($all.Count)."
          }
          $sig = Get-AuthenticodeSignature -LiteralPath $signed[0].FullName
          if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate -or
              $sig.SignerCertificate.Subject -notmatch '(?i)SignPath Foundation') {
            throw "Signed Setup failed public publisher/timestamp verification: $($sig.Status), $($sig.SignerCertificate.Subject)"
          }
          New-Item -ItemType Directory -Path dist/signed-installer | Out-Null
          Move-Item -LiteralPath $signed[0].FullName -Destination (Join-Path 'dist/signed-installer' $signed[0].Name)

      - name: Upload the verified signed installer
        id: signed-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/signed-installer/*setup.exe
          if-no-files-found: error
          retention-days: 1

  # Assemble only artifact-id-bound inputs on a fresh hosted runner, verify all
  # eight public signatures, attest the exact bytes and publish the sole package
  # consumed by installation and release jobs.
  package:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-validation.')
    needs: [sign-payload, compile-installer, sign-installer]
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      package-artifact-id: ${{ steps.final-package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download exact signed-stage support by artifact id
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.compile-installer.outputs.package-support-artifact-id }}
          path: dist
          merge-multiple: true

      - name: Refuse any unexpected support file
        shell: pwsh
        run: |
          $expected = @('stage.zip','stage/manifest.json','sbom.json','python-stdlib-audit.json','python-stdlib-audit.sarif') | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath dist -File -Recurse | ForEach-Object {
            $_.FullName.Substring((Resolve-Path dist).Path.Length).TrimStart([char[]]@('\','/')).Replace('\','/')
          } | Sort-Object)
          if (@(Compare-Object $expected $actual).Count) {
            throw "Package support artifact inventory is not exact:`n$(@(Compare-Object $expected $actual) | Out-String)"
          }

      - name: Download exact signed installer by artifact id
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.sign-installer.outputs.signed-installer-artifact-id }}
          path: dist/signed-installer
          merge-multiple: true

      - name: Reconstruct and verify the final package
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -LiteralPath dist/signed-installer -Filter '*setup.exe' -File -Recurse)
          $installerFiles = @(Get-ChildItem -LiteralPath dist/signed-installer -File -Recurse)
          if ($setups.Count -ne 1 -or $installerFiles.Count -ne 1) {
            throw "Signed-installer artifact inventory is not exact: setup=$($setups.Count), files=$($installerFiles.Count)."
          }
          Move-Item -LiteralPath $setups[0].FullName -Destination (Join-Path dist $setups[0].Name)
          Remove-Item -LiteralPath dist/signed-installer -Recurse -Force

          Expand-Archive -LiteralPath dist/stage.zip -DestinationPath dist/stage-expanded
          $looseManifestHash = (Get-FileHash dist/stage/manifest.json -Algorithm SHA256).Hash
          $archiveManifestHash = (Get-FileHash dist/stage-expanded/manifest.json -Algorithm SHA256).Hash
          if ($looseManifestHash -ne $archiveManifestHash) { throw 'Loose and archived signed manifests differ.' }
          Remove-Item -LiteralPath dist/stage -Recurse -Force
          Move-Item -LiteralPath dist/stage-expanded -Destination dist/stage

          . ./scripts/horizun-deploy.lib.ps1
          $mismatch = @(Test-HorizunStageMatchesManifest 'dist/stage')
          if ($mismatch.Count) { throw "Final signed stage does not match its manifest: $($mismatch -join '; ')" }
          $targets = @(@(Get-HorizunOwnBinaries 'dist/stage') | ForEach-Object { Get-Item $_ }) + `
                     @(Get-ChildItem dist -Filter '*setup.exe' -File)
          if ($targets.Count -ne 8) { throw "Expected seven payload binaries and one Setup; found $($targets.Count)." }
          foreach ($file in $targets) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate -or
                $sig.SignerCertificate.Subject -eq $sig.SignerCertificate.Issuer -or
                $sig.SignerCertificate.Subject -notmatch '(?i)SignPath Foundation') {
              throw "Installable release contains unsigned, invalid, self-signed or untimestamped own binaries: $($file.FullName), $($sig.Status)"
            }
          }
          pwsh scripts/version-consistency.tests.ps1 -RequireStage -RequireInstaller
          if ($LASTEXITCODE -ne 0) { throw "final version consistency failed ($LASTEXITCODE)" }

      - name: Validate the final CycloneDX SBOM
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'cyclonedx-win-x64.exe'
          $url = 'https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-win-x64.exe'
          $expected = 'b1c00dbb40e628ec8c1252771871341ac4d4aaf032f832d83bd22cb2b1d258ae'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $tool
          if ((Get-FileHash $tool -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'CycloneDX CLI checksum mismatch.' }
          & $tool validate --input-file dist/sbom.json --input-format json --input-version v1_6 --fail-on-errors
          if ($LASTEXITCODE -ne 0) { throw "CycloneDX validation failed ($LASTEXITCODE)" }

      - name: Generate final checksums and package identity
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist -Filter '*setup.exe' -File)
          if ($setup.Count -ne 1) { throw "Expected one setup, found $($setup.Count)." }
          $releaseFiles = @(
            $setup[0], (Get-Item dist/sbom.json),
            (Get-Item dist/python-stdlib-audit.json), (Get-Item dist/python-stdlib-audit.sarif),
            (Get-Item dist/stage/manifest.json)
          )
          $releaseFiles | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) *$($_.Name)"
          } | Out-File dist/SHA256SUMS.txt -Encoding ascii

          $files = @{
            installer = $setup[0].FullName; 'sbom.json' = 'dist/sbom.json'
            'manifest.json' = 'dist/stage/manifest.json'; 'stage.zip' = 'dist/stage.zip'
            'SHA256SUMS.txt' = 'dist/SHA256SUMS.txt'
          }
          $hashes = @{}
          foreach ($key in $files.Keys) {
            $hashes[$key] = @{
              name = (Split-Path -Leaf $files[$key])
              sha256 = (Get-FileHash $files[$key] -Algorithm SHA256).Hash.ToLowerInvariant()
              size = (Get-Item $files[$key]).Length
            }
          }
          $doc = Get-Content dist/stage/manifest.json -Raw | ConvertFrom-Json
          [pscustomobject]@{
            schema = 1; commit = $doc.Commit; workflow_sha = '${{ github.sha }}'
            built_utc = (Get-Date).ToUniversalTime().ToString('o'); files = $hashes
            signpath_payload_request = '${{ needs.sign-payload.outputs.signing-request-url }}'
            signpath_installer_request = '${{ needs.sign-installer.outputs.signing-request-url }}'
          } | ConvertTo-Json -Depth 5 | Out-File dist/package-hashes.json -Encoding utf8

      - name: Attest final build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*setup.exe
            dist/stage/manifest.json

      - name: Attest final CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*setup.exe
          sbom-path: dist/sbom.json

      - name: Publish the final signed package
        id: final-package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizun-mcp-package
          path: |
            dist/*setup.exe
            dist/sbom.json
            dist/python-stdlib-audit.json
            dist/python-stdlib-audit.sarif
            dist/package-hashes.json
            dist/SHA256SUMS.txt
            dist/stage.zip
            dist/stage/manifest.json
          if-no-files-found: error

  # The release's stated trust state is re-evaluated on a disposable
  # Microsoft-hosted machine. Every installable tag must be publicly trusted and
  # timestamped, exactly as the public bootstrap requires before executing Setup.
  public-signature:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-validation.')
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the exact signed package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.package-artifact-id }}
          path: dist
          merge-multiple: true

      - name: Enforce the versioned trust promise on a clean runner
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath dist/stage.zip -DestinationPath dist/stage -Force
          . ./scripts/horizun-deploy.lib.ps1
          $targets = @(@(Get-HorizunOwnBinaries 'dist/stage') | ForEach-Object { Get-Item $_ }) + `
                     @(Get-ChildItem dist -Filter '*setup.exe' -File)
          if ($targets.Count -ne 8) {
            throw "Expected server exe+dll, five Revit DLLs and setup; found $($targets.Count)."
          }
          foreach ($file in $targets) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($sig.Status -ne 'Valid') {
              throw "$($file.FullName) is not publicly trusted on a clean Windows runner: $($sig.Status) - $($sig.StatusMessage)"
            }
            if (-not $sig.TimeStamperCertificate) {
              throw "$($file.FullName) has no trusted Authenticode timestamp."
            }
            if ($sig.SignerCertificate.Subject -eq $sig.SignerCertificate.Issuer) {
              throw "$($file.FullName) is self-signed, not a public publisher identity."
            }
            $identity = $sig.SignerCertificate.Subject
            if ($identity -notmatch '(?i)SignPath Foundation') {
              throw "$($file.FullName) is not signed by the SignPath Foundation release publisher: $identity"
            }
            Write-Host "  trusted $($file.Name) - $($sig.SignerCertificate.Subject)"
          }

  # ---------------------------------------------------------------------------
  # Install exactly once. Reinstalling the identical package before every Revit
  # year adds no evidence and creates a false dependency on unrelated MCP clients
  # staying closed for the whole matrix. The immutable installed payload is
  # proven here; the next job exercises it in each supported Revit API.
  # ---------------------------------------------------------------------------
  install-package:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-validation.') && vars.HAS_REVIT_RUNNER == 'true' && vars.REVIT_RUNNER_GROUP != '' }}
    needs: package
    runs-on:
      group: ${{ vars.REVIT_RUNNER_GROUP }}
      labels: [self-hosted, windows, revit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # DOWNLOAD THE ARTIFACT. This job used to read dist/ straight off the runner
      # and call it "the packaged artifact". On a self-hosted runner that directory
      # is whatever the previous job happened to leave in the workspace: an
      # installer from an earlier run, a dist/ that checkout did not clean, or -
      # when the package job runs on a different machine from this one - nothing at
      # all. The job that exists to prove the SHIPPED package works was testing a
      # directory, and on a good day the two were the same thing.
      - name: Get the package this run built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.package-artifact-id }}
          path: dist
          merge-multiple: true

      # AND PROVE IT IS THAT ONE. A download is a network operation; it can hand
      # back a truncated file or, with a name collision across runs, somebody
      # else's. Every hash the package job recorded is re-checked here, before the
      # installer is executed - which is the last moment checking is cheap.
      - name: Verify the downloaded package is byte-for-byte the one that was built
        shell: pwsh
        run: |
          $hashFile = 'dist/package-hashes.json'
          if (-not (Test-Path $hashFile)) {
            throw "the artifact carries no package-hashes.json, so there is no way to tell whether what was downloaded is what was built. Refusing to install it."
          }
          $rec = Get-Content $hashFile -Raw | ConvertFrom-Json

          # The artifact must be from THIS run's commit. A cached artifact from an
          # earlier commit would install cleanly and be verified against its own
          # manifest, and every check downstream would pass about the wrong build.
          if ($rec.workflow_sha -ne "${{ github.sha }}") {
            throw "this artifact was built from ${{ github.sha }}'s workflow? no: it records $($rec.workflow_sha), and this run is ${{ github.sha }}. It is from a different run."
          }

          $setup = Get-ChildItem dist -Filter '*setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw "the downloaded artifact contains no installer" }

          $onDisk = @{
            'installer'     = $setup.FullName
            'sbom.json'     = 'dist/sbom.json'
            'manifest.json' = 'dist/stage/manifest.json'
            'stage.zip'     = 'dist/stage.zip'
            'SHA256SUMS.txt'= 'dist/SHA256SUMS.txt'
          }
          $wrong = @()
          foreach ($k in $onDisk.Keys) {
            $expected = $rec.files.$k
            if (-not $expected) { $wrong += "$k : the package recorded no hash for it"; continue }
            if (-not (Test-Path $onDisk[$k])) { $wrong += "$k : missing from the download"; continue }
            $actual = (Get-FileHash $onDisk[$k] -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected.sha256) { $wrong += "$k : $actual, built as $($expected.sha256)" }
            else { Write-Host "  ok  $k  $($actual.Substring(0,16))..." }
          }
          if ($wrong.Count -gt 0) {
            throw "the downloaded package does not match what was built:`n  - $($wrong -join "`n  - ")"
          }
          Write-Host "the package is byte-for-byte the one built from commit $($rec.commit)"

      - name: Restore the complete staged payload and its build timestamps
        shell: pwsh
        run: |
          $archive = (Resolve-Path 'dist/stage.zip').Path
          $destination = Join-Path (Resolve-Path 'dist').Path 'stage'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          if (-not (Test-Path 'dist/stage/server/horizun-mcp.exe')) {
            throw 'stage.zip did not restore the server payload'
          }

      # THE INSTALLED ARTIFACT, NOT bin/Release.
      #
      # This job used to run verify-live with its default -Server, which pointed
      # at src/.../bin/Release. So the integration suite proved the developer
      # build worked and said nothing about the package anybody installs - which
      # is the only build a release is about. verify-live now refuses a
      # bin/Release path unless told to, and this installs the real thing first.
      - name: Install the packaged artifact
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "no installer was produced by the package job" }
          Write-Host "installing $($setup.Name)"
          # LOCAL, because that is what the installer stamps - Inno's
          # GetDateTimeString has no UTC form. The first version of this compared
          # a local stamp against a UTC clock and rejected a good install as
          # stale on any machine not on UTC.
          $startedLocal = Get-Date
          $result = Join-Path $env:RUNNER_TEMP "horizun-install-result-${{ github.run_id }}.txt"
          # CI validates the installed artifact directly. It must never discover
          # or rewrite a maintainer's personal Claude/Codex configuration on the
          # self-hosted release runner.
          $p = Start-Process $setup.FullName -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/HORIZUNCLIENT=None',"/HORIZUNRESULT=$result" -Wait -PassThru

          # BOTH, and neither alone. Inno returns 0 from any install that
          # COMPLETES - including one where a year failed and was rolled back -
          # so 0 does not mean fully installed. But a NON-ZERO code means Setup
          # never completed, and then install-result.txt is whatever the previous
          # run left behind.
          #
          # Measured on 2026-07-30: a silent install exited 1 having deployed
          # NOTHING, and the four-hour-old result file in {app} still said
          # fully_installed=yes. The first version of this step read only that
          # file and would have called it a success.
          if ($p.ExitCode -ne 0) { throw "Setup did not complete: exit code $($p.ExitCode). Nothing can be concluded from install-result.txt - it is from an earlier run." }

          if (-not (Test-Path $result)) { throw "the installer left no install-result.txt" }
          Get-Content $result | Write-Host

          $text = Get-Content $result -Raw
          if ($text -notmatch 'installed_local\s*=\s*(\S+ \S+)') { throw "install-result.txt has no installed_local - it predates this installer and its freshness cannot be checked" }
          $stamp = [datetime]::ParseExact($Matches[1], 'yyyy-MM-dd HH:mm:ss', $null)
          if ($stamp -lt $startedLocal.AddMinutes(-5)) { throw "install-result.txt is STALE ($stamp local, this run started $startedLocal local) - it is from an earlier install" }
          if ($text -notmatch 'server_installed\s*=\s*yes') { throw "the server was not installed" }
          if ($text -notmatch 'any_revit_found\s*=\s*yes') { throw "no Revit installation was found" }
          # Horizontal whitespace only. \s also consumes the newline after an
          # empty `failed=` and then mistakes the next key (`fully_installed`)
          # for a failed year; a completely green install was measured doing so.
          if ($text -match '(?m)^failed[ \t]*=[ \t]*\S') { throw "one or more Revit payloads failed" }
          if ($text -notmatch 'fully_installed\s*=\s*yes') { throw "the install was PARTIAL - see install-result.txt above" }

      # The chain, end to end: source commit -> manifest -> stage -> installed.
      # Hashes prove identity; the commit stamped into each binary proves
      # provenance. Neither alone answers "is everything installed one clean
      # commit, and is it the one in the tree".
      - name: Verify one clean commit from source to what is installed
        shell: pwsh
        # Branch builds keep an explicit unsigned development exception. Every
        # tagged binary release must be publicly signed, matching the bootstrap.
        # The result path is the exact per-run file requested in the install step,
        # never the global result left by an earlier install.
        run: |
          pwsh scripts/verify-release.ps1 -Installed -InstallResult "$env:RUNNER_TEMP/horizun-install-result-${{ github.run_id }}.txt" -Json artifacts/live/release-chain.json
          if ($LASTEXITCODE -ne 0) { throw "installed signed release verification failed ($LASTEXITCODE)" }

      - name: Publish the installed release-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-release-chain
          # Every live job starts from a clean checkout. The orchestrator needs
          # this manifest to bind the installed server and selected add-in year
          # to the package commit before it opens Revit.
          path: |
            artifacts/live/release-chain.json
            dist/stage/manifest.json

  # ---------------------------------------------------------------------------
  # The integration suite: real commands against real disposable models. Every
  # year consumes the one package install proven above; compilation alone is not
  # a substitute for opening the payload in that Revit API.
  # ---------------------------------------------------------------------------
  revit-integration:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-validation.') && vars.HAS_REVIT_RUNNER == 'true' && vars.REVIT_RUNNER_GROUP != '' }}
    needs: install-package
    runs-on:
      group: ${{ vars.REVIT_RUNNER_GROUP }}
      labels: [self-hosted, windows, revit]
    strategy:
      fail-fast: false
      # This matrix shares one interactive Windows desktop. Two simultaneous
      # Revit sessions would make target selection ambiguous and invalidate both
      # reports, even if more runner slots are added later.
      max-parallel: 1
      matrix:
        year: [2023, 2024, 2025, 2026, 2027]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get the proven install manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installed-release-chain
          path: .

      - name: Live verification against a running Revit ${{ matrix.year }}
        shell: pwsh
        # This owns the whole lifecycle. Merely invoking verify-live.ps1 does not
        # start Revit, open fixtures, close a workset or opt into the committing
        # tier; without those steps a green-looking job cannot be release evidence.
        run: pwsh scripts/run-release-live-gate.ps1 -Year ${{ matrix.year }} -Json "artifacts/live/live-${{ matrix.year }}.json"

      # always(), because the JSON of a FAILED run is the artifact somebody
      # actually needs. Publishing only the green ones is publishing nothing.
      - name: Publish the live-verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-verification-${{ matrix.year }}
          path: artifacts/live

  # A stable tag gets one matrix artifact that is mechanically complete. The
  # release job consumes this artifact; it cannot substitute a skipped year or
  # an old local report.
  stable-release-evidence:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: revit-integration
    runs-on: ubuntu-latest
    steps:
      - name: Download every live report from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: live-verification-*
          path: live
          merge-multiple: true

      - name: Require a clean release-gate report for all five years
        shell: pwsh
        run: |
          foreach ($year in 2023,2024,2025,2026,2027) {
            $path = "live/live-$year.json"
            if (-not (Test-Path $path)) { throw "missing published live report for Revit $year" }
            $doc = Get-Content $path -Raw | ConvertFrom-Json
            if (-not $doc.release_gate -or $doc.revit_year -ne $year) { throw "$path is not this year's release-gate report" }
            if ($doc.summary.failed -ne 0 -or $doc.summary.unverified -ne 0 -or $doc.summary.not_covered -ne 0) {
              throw "$path is incomplete: $($doc.summary | ConvertTo-Json -Compress)"
            }
          }

      - name: Publish the complete stable matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-live-matrix-${{ github.ref_name }}
          path: live/live-*.json

  publish-stable-release:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.repository == 'HorizunGroup/horizun-revit-mcp'
    needs: [package, public-signature, stable-release-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exact package from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.package-artifact-id }}
          path: release
          merge-multiple: true

      - name: Download the complete live matrix from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-live-matrix-${{ github.ref_name }}
          path: release/live

      - name: Create or complete the stable GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*setup.exe release/SHA256SUMS.txt release/sbom.json release/python-stdlib-audit.json release/python-stdlib-audit.sarif release/package-hashes.json release/stage/manifest.json release/live/live-*.json)
          if [ "${#files[@]}" -ne 12 ]; then
            printf 'Expected installer + 6 metadata files + 5 live reports; found %s\n' "${#files[@]}" >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          expected=$(printf '%s\n' "${files[@]##*/}" | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            remote=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
            extra=$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$remote"))
            if [ -n "$extra" ]; then
              printf 'Existing release has unauthorized assets; refusing to preserve them:\n%s\n' "$extra" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --latest --prerelease=false --draft=false
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --generate-notes --latest --title "Horizun Revit MCP $GITHUB_REF_NAME"
          fi
          actual=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'Published stable asset inventory is not exact.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

  publish-preview-release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-preview.') && github.repository == 'HorizunGroup/horizun-revit-mcp'
    needs: [package, public-signature]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exact preview package from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package.outputs.package-artifact-id }}
          path: release
          merge-multiple: true

      - name: Create or complete the preview GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*setup.exe release/SHA256SUMS.txt release/sbom.json release/python-stdlib-audit.json release/python-stdlib-audit.sarif release/package-hashes.json release/stage/manifest.json)
          if [ "${#files[@]}" -ne 7 ]; then
            printf 'Expected preview installer + 6 metadata files; found %s\n' "${#files[@]}" >&2
            exit 1
          fi
          expected=$(printf '%s\n' "${files[@]##*/}" | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            remote=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
            extra=$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$remote"))
            if [ -n "$extra" ]; then
              printf 'Existing preview has unauthorized assets; refusing to preserve them:\n%s\n' "$extra" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --prerelease --latest=false --draft=false
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --generate-notes --prerelease --title "Horizun Revit MCP $GITHUB_REF_NAME"
          fi
          actual=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'Published preview asset inventory is not exact.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

  publish-validation-release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-validation.') && github.repository == 'HorizunGroup/horizun-revit-mcp'
    needs: [revit-free, windows-deployment]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish a validation-only release with no binary assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          note='Validation-only tag: source tests, harness, documentation or CI evidence. No installable binaries are attached and this release is never latest.'
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
            if [ "$assets" -ne 0 ]; then
              echo "Existing validation-only release has $assets asset(s); refusing to claim no binaries." >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --prerelease --latest=false --draft=false --notes "$note"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "Horizun Revit MCP $GITHUB_REF_NAME" --notes "$note"
          fi
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
          if [ "$assets" -ne 0 ]; then
            echo "Validation-only release unexpectedly contains $assets asset(s)." >&2
            exit 1
          fi

  publish-mcp-registry:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && github.repository == 'HorizunGroup/horizun-revit-mcp'
    needs: publish-stable-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate registry metadata from the canonical version
        shell: pwsh
        run: pwsh scripts/generate-mcp-manifest.ps1 -OutFile .mcp/server.json

      - name: Install the pinned official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz'
          expected='1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf'
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output mcp-publisher.tar.gz
          echo "$expected  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate .mcp/server.json

      - name: Authenticate and publish official registry metadata
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish .mcp/server.json

  # ---------------------------------------------------------------------------
  # Says out loud what did not run. Without this, a green run looks complete.
  # ---------------------------------------------------------------------------
  coverage-statement:
    if: ${{ always() }}
    needs: [revit-free, windows-deployment, revit-addin, build-stage, sign-payload, compile-installer, sign-installer, package, install-package, revit-integration]
    runs-on: ubuntu-latest
    steps:
      - name: What this run did and did not cover
        run: |
          echo "Proved here: the MCP server, the honesty arithmetic, coverage rules,"
          echo "request ownership, the wire protocol, contract drift and multi-instance discovery."
          echo "Also here: the structural half of the sensitive-name scan. The NAME half needs"
          echo "a wordlist that is deliberately not in this repository, so on a hosted runner it"
          echo "reports NOT RUN - which is not the same as passing, and is not printed as if it were."
          echo "Job results: revit-free=${{ needs.revit-free.result }}, windows-deployment=${{ needs.windows-deployment.result }}, add-in=${{ needs.revit-addin.result }}, build-stage=${{ needs.build-stage.result }}, sign-payload=${{ needs.sign-payload.result }}, compile-installer=${{ needs.compile-installer.result }}, sign-installer=${{ needs.sign-installer.result }}, package=${{ needs.package.result }}, install=${{ needs.install-package.result }}, integration=${{ needs.revit-integration.result }}."
          if [ "${{ needs.revit-integration.result }}" = "success" ]; then
            echo "Revit jobs: RAN and completed successfully."
            echo "Integration ran against the INSTALLED artifact on Revit 2023 through 2027, with the"
            echo "commit and full SHA-256 of the server and that year's add-in checked against the"
            echo "release manifest. NOT COVERED exits 3 under -ReleaseGate."
          else
            echo "::warning::The complete Revit integration matrix did not run successfully in this workflow."
            echo "NOT covered by this run: the add-in for any year, packaging, the installer,"
            echo "and every command that touches a model. A configured flag is not execution evidence;"
            echo "the individual job results above are the authoritative record for this run."
          fi

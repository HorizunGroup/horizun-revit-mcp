# Horizun MCP - continuous integration.
#
# THE HONEST BOUNDARY, stated once so nothing below has to hedge.
#
# A hosted runner has no Revit, so it has no RevitAPI.dll. The add-in cannot be
# compiled here for any year, and no amount of CI configuration changes that.
# Everything that does NOT need Revit is proved here, on every push. Everything
# that DOES is declared as a job that runs only on a self-hosted runner with
# Revit installed, and is skipped - visibly - when there is none.
#
# A skipped job that says why is worth more than a green tick that covered less
# than it appeared to.
name: ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Everything provable without Revit. This is the gate for merging.
  # ---------------------------------------------------------------------------
  revit-free:
    runs-on: ubuntu-latest    # the Revit-free surface is plain net8.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Restore before build, explicitly, so a build failure is a build failure
      # and a restore failure says so.
      # Found in the field 2026-08-04: a v0.6.1 tag shipped while both .csproj still
      # said 0.6.0. In a project that stamps commit + SHA-256 into every binary, a
      # version number that disagrees with its own tag is the one identity nobody
      # verified. Every project inherits one value; a tagged build must match it.
      - name: Product version matches the tag, when there is one
        shell: bash
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          test -n "$version" || { echo "::error::Directory.Build.props has no product Version"; exit 1; }
          echo "Horizun=$version ref=$GITHUB_REF"
          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="${GITHUB_REF#refs/tags/v}"
              if [ "$tag" != "$version" ]; then
                echo "::error::Tag v$tag but <Version> is $version. Bump Directory.Build.props (and the CHANGELOG) before cutting the tag."
                exit 1
              fi ;;
          esac

      - name: Tagged releases require the live Revit gate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${{ vars.HAS_REVIT_RUNNER }}" != "true" ]; then
            echo "::error::A release tag cannot pass without the self-hosted Revit runner. Publish a preview from a non-tag build or restore the full live gate first."
            exit 1
          fi

      - name: Restore
        run: |
          dotnet restore src/Horizun.Server/Horizun.Server.csproj
          dotnet restore tests/Horizun.Core.Tests/Horizun.Core.Tests.csproj
          dotnet restore tests/Horizun.Server.Tests/Horizun.Server.Tests.csproj

      # Warnings as errors HERE and not in the csproj: a developer mid-change
      # should not be blocked by a warning, and main should not accumulate them.
      - name: Build the MCP server (warnings are errors)
        run: dotnet build src/Horizun.Server/Horizun.Server.csproj -c Release --no-restore -warnaserror

      - name: Test - honesty arithmetic, coverage rules, request ownership
        run: dotnet test tests/Horizun.Core.Tests/Horizun.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/tests

      # Named separately because these are the ones that answer "did the two
      # halves drift" and "can two answers collide on one id" - the failures
      # that are invisible in a single lumped result line.
      - name: Test - contract drift, wire protocol, multi-instance discovery
        run: dotnet test tests/Horizun.Server.Tests/Horizun.Server.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=server.trx" --results-directory artifacts/tests

      - name: Audit dependencies for known vulnerabilities
        # The audit includes the Revit project. It does not build Revit on this
        # Linux runner, but MSBuild must be allowed to evaluate its Windows TFM.
        env:
          EnableWindowsTargeting: true
        run: |
          set -e
          for p in \
            src/Horizun.Server/Horizun.Server.csproj \
            src/Horizun.Revit/Horizun.Revit.csproj \
            tests/Horizun.Core.Tests/Horizun.Core.Tests.csproj \
            tests/Horizun.Server.Tests/Horizun.Server.Tests.csproj; do
            # Capture stderr too.  A failed audit command must name its project
            # and retain its diagnostic instead of vanishing under `set -e`.
            if ! out=$(dotnet list "$p" package --vulnerable --include-transitive 2>&1); then
              echo "$out"
              echo "::error::dependency audit could not run for $p"
              exit 1
            fi
            echo "$out"
            # The command exits 0 whether or not it found anything, so the text is
            # the result. A vulnerable package must fail the build, not be logged.
            if echo "$out" | grep -q "has the following vulnerable packages"; then
              echo "::error::vulnerable packages in $p"
              exit 1
            fi
          done
          echo "no vulnerable packages"

      - name: Test release scripts and public metadata consistency
        shell: pwsh
        run: |
          pwsh scripts/install-arguments.tests.ps1
          pwsh scripts/install-result.tests.ps1
          pwsh scripts/install-completion.tests.ps1
          pwsh scripts/manifest-integrity.tests.ps1
          pwsh scripts/register-client.tests.ps1
          pwsh scripts/scan-sensitive.tests.ps1
          pwsh scripts/server-update.tests.ps1
          pwsh scripts/public-consistency.tests.ps1

      - name: Whitespace and line-ending hygiene
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1 HEAD
          else
            git diff --check $(git hash-object -t tree /dev/null) HEAD
          fi

      # Client, project and model names. The STRUCTURAL rules run here and need no
      # wordlist - a home directory with a real name in it, an e-mail address, a
      # cloud project path. The NAME check needs the wordlist, which is
      # deliberately not in this repository (client and project names never enter it), so on a
      # hosted runner it reports NOT RUN rather than passing quietly. The
      # self-hosted release gate is where -RequireTerms makes that a failure.
      - name: Scan for client, project and model names
        shell: pwsh
        run: pwsh scripts/scan-sensitive.ps1 -Json artifacts/scan/sensitive.json

      - name: Publish the client-name scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensitive-scan
          path: artifacts/scan

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/tests

  # ---------------------------------------------------------------------------
  # The add-in, per Revit year. Needs a machine with Revit; skipped otherwise,
  # and the skip is the point - it is visible rather than assumed.
  # ---------------------------------------------------------------------------
  revit-addin:
    if: ${{ vars.HAS_REVIT_RUNNER == 'true' }}
    runs-on: [self-hosted, windows, revit]
    strategy:
      fail-fast: false
      # One Windows desktop can host one unattended Revit session safely. Running
      # two matrix rows together would either make target selection ambiguous or
      # make one row kill/overwrite the other's fixture state.
      max-parallel: 1
      matrix:
        year: [2023, 2024, 2025, 2026, 2027]
    steps:
      - uses: actions/checkout@v7

      - name: Build the add-in for Revit ${{ matrix.year }} against its own RevitAPI
        shell: pwsh
        run: |
          dotnet build src/Horizun.Revit/Horizun.Revit.csproj -c Release -p:RevitYear=${{ matrix.year }} -warnaserror

      # The framework is re-read from the produced bytes rather than trusted from
      # the build log: bin is shared across years and a leftover is invisible.
      - name: Verify the artifact is the runtime that year hosts
        shell: pwsh
        run: |
          $dll = "src/Horizun.Revit/bin/Release/Horizun.Revit.dll"
          $t = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($dll))
          $year = ${{ matrix.year }}
          $want = if ($year -le 2024) { '.NETFramework,Version=v4.8' }
                  elseif ($year -ge 2027) { '.NETCoreApp,Version=v10.0' }
                  else { '.NETCoreApp,Version=v8.0' }
          if ($t -notlike "*$want*") { throw "Revit $year artifact is not $want" }
          Write-Host "Revit $year -> $want, sha $((Get-FileHash $dll -Algorithm SHA256).Hash.Substring(0,16))"

  # ---------------------------------------------------------------------------
  # Packaging: every year built, staged, inventoried, and wrapped. Also needs
  # Revit (each year is compiled against its own API) plus Inno Setup.
  # ---------------------------------------------------------------------------
  package:
    if: ${{ vars.HAS_REVIT_RUNNER == 'true' }}
    needs: [revit-free, revit-addin]
    runs-on: [self-hosted, windows, revit]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - name: Build and stage every supported year
        shell: pwsh
        run: pwsh scripts/pack.ps1 -SkipInstaller

      # The stage is validated on its own, because "pack did not throw" and "the
      # payload is correct" are different claims.
      - name: Validate the staged payload
        shell: pwsh
        run: |
          $stage = "dist/stage"
          $doc = Get-Content "$stage/manifest.json" -Raw | ConvertFrom-Json
          if ($doc.Schema -ne 2) { throw "expected manifest schema 2, got '$($doc.Schema)'" }

          # A package must name ONE commit, and it must be a commit these binaries
          # actually are. -dirty means the sha names something else.
          if (-not $doc.Commit -or $doc.Commit -eq 'unknown') { throw "the manifest names no commit" }
          if ($doc.Commit.Length -ne 40) { throw "the manifest's commit is not a full sha: $($doc.Commit)" }
          if (-not $doc.CleanTree) { throw "packaged from a DIRTY tree - the commit in this manifest is not what these binaries are" }

          # The server is half of what gets installed, and the half the manifest
          # used to omit entirely.
          $srvSha = (Get-FileHash "$stage/$($doc.Server.File)" -Algorithm SHA256).Hash.ToLower()
          if ($srvSha -ne $doc.Server.Sha256) { throw "server: manifest says $($doc.Server.Sha256), file is $srvSha" }
          if ($doc.Server.Sha256.Length -ne 64) { throw "the server hash is truncated - a prefix identifies nothing" }
          foreach ($helper in 'register-client.ps1','verify-clients.ps1','verify-install.ps1','complete-install.ps1','stop-installed-server.ps1','hz-call.ps1','uninstall-cleanup.ps1') {
            if (-not (Test-Path "$stage/server/client-tools/$helper")) {
              throw "installer client helper is missing: $helper"
            }
          }

          if ($doc.Plugins.Count -lt 1) { throw "the manifest has no plugin payloads" }
          $seen = @{}
          foreach ($e in $doc.Plugins) {
            $dll = "$stage/plugin/$($e.Year)/Horizun.Revit.dll"
            if (-not (Test-Path $dll)) { throw "manifest names $($e.Year) but its payload is missing" }
            $sha = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $e.Sha256) { throw "$($e.Year): manifest says $($e.Sha256), file is $sha" }
            if ($e.Sha256.Length -ne 64) { throw "$($e.Year): truncated hash - a 16-character prefix verifies nothing" }
            # Two years sharing a hash means one was built against the wrong API -
            # the exact defect the per-year build exists to remove.
            if ($seen.ContainsKey($sha)) { throw "$($e.Year) and $($seen[$sha]) are the SAME binary" }
            $seen[$sha] = $e.Year
            foreach ($needed in 'IronPython.dll','Newtonsoft.Json.dll') {
              if (-not (Test-Path "$stage/plugin/$($e.Year)/$needed")) { throw "$($e.Year): $needed missing" }
            }
          }

          # All five, or the package silently drops a Revit generation and the
          # symptom lands on whoever opens that year weeks later.
          $missing = @(2023,2024,2025,2026,2027 | Where-Object { $_ -notin $doc.Plugins.Year })
          if ($missing.Count -gt 0) { throw "no payload for $($missing -join ', ') - this runner is missing those Revit versions" }

          Write-Host "validated commit $($doc.Commit), server + $($doc.Plugins.Count) per-year payloads, all distinct, full hashes"

      - name: Prove an active CLI update stops only the installed server path
        shell: pwsh
        run: pwsh scripts/server-update.tests.ps1 -RequireWindows

      # The full check, with the wordlist that lives on this runner. -RequireTerms
      # makes a MISSING wordlist a failure: at a release gate, "the name check did
      # not run" must not be indistinguishable from "it passed".
      - name: Scan for client names, with the wordlist (release gate)
        shell: pwsh
        run: pwsh scripts/scan-sensitive.ps1 -RequireTerms -Json artifacts/scan/sensitive-release.json

      - name: Inventory what ships (fails on an unidentified licence)
        shell: pwsh
        run: |
          pwsh scripts/sbom.ps1
          pwsh scripts/sbom.tests.ps1
          pwsh scripts/version-consistency.tests.ps1 -RequireStage

      - name: Validate the SBOM with the pinned official CycloneDX CLI
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'cyclonedx-win-x64.exe'
          $url = 'https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-win-x64.exe'
          $expected = 'b1c00dbb40e628ec8c1252771871341ac4d4aaf032f832d83bd22cb2b1d258ae'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $tool
          $actual = (Get-FileHash $tool -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "CycloneDX CLI checksum mismatch: $actual" }
          & $tool validate --input-file dist/sbom.json --input-format json --input-version v1_6 --fail-on-errors
          if ($LASTEXITCODE -ne 0) { throw "CycloneDX validation failed ($LASTEXITCODE)" }

      - name: Compile the installer and sign releases from 1.0 onward
        shell: pwsh
        run: |
          $releaseTag = '${{ startsWith(github.ref, 'refs/tags/v') }}' -eq 'true'
          $requiresPublicSignature = $releaseTag -and ([version]('${{ github.ref_name }}'.TrimStart('v'))).Major -ge 1
          $thumbprint = '${{ vars.SIGNING_CERT_THUMBPRINT }}'.Trim()
          if ($requiresPublicSignature -and -not $thumbprint) {
            throw 'Horizun 1.0 and later require repository variable SIGNING_CERT_THUMBPRINT and its private key on the release runner. There is no unsigned exception from 1.0 onward.'
          }
          try {
            if ($requiresPublicSignature) {
              pwsh scripts/sign.ps1 -Thumbprint $thumbprint
              if ($LASTEXITCODE -ne 0) { throw "staged payload signing failed ($LASTEXITCODE)" }
            } elseif ($releaseTag) {
              Write-Host '::warning::This 0.x release is intentionally unsigned. Verify SHA256SUMS.txt before installation. Public signing becomes mandatory at 1.0.0.'
            }

            pwsh scripts/pack.ps1 -InstallerOnly
            if ($LASTEXITCODE -ne 0) { throw "installer compilation failed ($LASTEXITCODE)" }

            if ($requiresPublicSignature) {
              # The second pass skips the already-signed stage and signs the new
              # setup.exe. Wrapper and payload are separate Authenticode objects.
              pwsh scripts/sign.ps1 -Thumbprint $thumbprint
              if ($LASTEXITCODE -ne 0) { throw "installer signing failed ($LASTEXITCODE)" }
            }
            pwsh scripts/version-consistency.tests.ps1 -RequireStage -RequireInstaller
          }
          finally {
            # The private key is provisioned outside the repository (certificate
            # store, token or cloud KSP). This workflow never exports or logs it.
            Remove-Item Env:SIGNING_CERT_PASSWORD -ErrorAction SilentlyContinue
          }

      - name: Generate release checksums
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist -Filter '*setup.exe' -File)
          if ($setup.Count -ne 1) { throw "expected one setup, found $($setup.Count)" }
          $releaseFiles = @(
            $setup[0],
            (Get-Item 'dist/sbom.json'),
            (Get-Item 'dist/stage/manifest.json')
          )
          $lines = foreach ($file in $releaseFiles) {
            $sha = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sha *$($file.Name)"
          }
          $lines | Out-File 'dist/SHA256SUMS.txt' -Encoding ascii
          Get-Content 'dist/SHA256SUMS.txt' | Write-Host

      # actions/upload-artifact deliberately does not preserve file mtimes. The
      # release-chain verifier uses those times as an independent chronology
      # check (the installer must be newer than everything it contains), so
      # transporting 3,520 loose files makes a good stage look post-installer.
      # ZIP stores each entry's build timestamp and is also much faster to move.
      - name: Archive the complete stage with its build timestamps
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $source = (Resolve-Path 'dist/stage').Path
          $archive = Join-Path (Resolve-Path 'dist').Path 'stage.zip'
          if (Test-Path $archive) { Remove-Item -LiteralPath $archive -Force }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $source,
            $archive,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          if (-not (Test-Path $archive)) { throw 'stage.zip was not created' }

      # 0.x releases may ship unsigned while the public identity is pending, but
      # they must say so. Starting with 1.0, unknown-publisher distribution is a
      # hard release failure with no bypass.
      - name: Enforce versioned signing policy
        shell: pwsh
        run: |
          $releaseTag = '${{ startsWith(github.ref, 'refs/tags/v') }}' -eq 'true'
          $requiresPublicSignature = $releaseTag -and ([version]('${{ github.ref_name }}'.TrimStart('v'))).Major -ge 1
          $unsigned = @()
          $selfSigned = @()
          $untimestamped = @()
          . ./scripts/horizun-deploy.lib.ps1
          $targets = @(@(Get-HorizunOwnBinaries 'dist/stage') | ForEach-Object { Get-Item $_ }) + `
                     @(Get-ChildItem dist -Filter '*setup.exe' -File)
          foreach ($f in $targets) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') { $unsigned += "$($f.FullName): $($sig.Status)" }
            elseif ($sig.SignerCertificate -and $sig.SignerCertificate.Subject -eq $sig.SignerCertificate.Issuer) {
              $selfSigned += "$($f.FullName): $($sig.SignerCertificate.Subject)"
            }
            if ($sig.Status -eq 'Valid' -and -not $sig.TimeStamperCertificate) {
              $untimestamped += $f.FullName
            }
          }
          if ($requiresPublicSignature -and ($unsigned.Count -gt 0 -or $selfSigned.Count -gt 0 -or $untimestamped.Count -gt 0)) {
            $details = @($unsigned) + @($selfSigned) + @($untimestamped | ForEach-Object { "${_}: no trusted timestamp" })
            throw "Horizun 1.0+ release contains unsigned, invalid, self-signed or untimestamped own binaries:`n  - $($details -join "`n  - ")"
          }
          if ($unsigned.Count -gt 0 -or $selfSigned.Count -gt 0 -or $untimestamped.Count -gt 0) {
            if ($releaseTag) {
              Write-Host "::warning::0.x release is not publicly signed; users must verify SHA256SUMS.txt. Version 1.0+ enforces this as a failure"
            } else {
              Write-Host "::warning::branch package is not publicly signed"
            }
            $unsigned | Select-Object -First 10 | ForEach-Object { Write-Host "  $_" }
            $selfSigned | Select-Object -First 10 | ForEach-Object { Write-Host "  $_" }
            $untimestamped | Select-Object -First 10 | ForEach-Object { Write-Host "  $_ : no trusted timestamp" }
          } else { Write-Host "everything is validly signed" }

      # WHAT THE NEXT JOB MUST BE ABLE TO CHECK IT RECEIVED.
      #
      # revit-integration installs this artifact and then verifies everything the
      # INSTALL produced against manifest.json. Nothing verified that the artifact
      # it installed was the artifact this job built - and it was not even
      # downloading it (see that job). An upload that truncates, or a download
      # that hands back a cached earlier run, would be indistinguishable from a
      # correct one, and every check downstream would then be measuring a package
      # nobody built here.
      #
      # manifest.json cannot contain its own hash, so the three hashes live beside
      # it. This is one root of trust, not zero.
      - name: Record what this package is, so the next job can prove it got it
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw "no installer was produced" }
          $files = @{
            'installer'     = $setup.FullName
            'sbom.json'     = 'dist/sbom.json'
            'manifest.json' = 'dist/stage/manifest.json'
            'stage.zip'     = 'dist/stage.zip'
            'SHA256SUMS.txt'= 'dist/SHA256SUMS.txt'
          }
          $hashes = @{}
          foreach ($k in $files.Keys) {
            if (-not (Test-Path $files[$k])) { throw "expected in the package but missing: $($files[$k])" }
            $hashes[$k] = @{
              name   = (Split-Path -Leaf $files[$k])
              sha256 = (Get-FileHash $files[$k] -Algorithm SHA256).Hash.ToLower()
              size   = (Get-Item $files[$k]).Length
            }
          }
          $doc = Get-Content 'dist/stage/manifest.json' -Raw | ConvertFrom-Json
          [pscustomobject]@{
            schema       = 1
            commit       = $doc.Commit
            workflow_sha = "${{ github.sha }}"
            built_utc    = (Get-Date).ToUniversalTime().ToString('o')
            files        = $hashes
          } | ConvertTo-Json -Depth 5 | Out-File 'dist/package-hashes.json' -Encoding utf8
          Get-Content 'dist/package-hashes.json' | Write-Host

      - name: Attest build provenance for tagged artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*setup.exe
            dist/stage/manifest.json

      - name: Attest the CycloneDX SBOM for the installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: dist/*setup.exe
          sbom-path: dist/sbom.json

      - name: Publish the installer, timestamped stage, manifest and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: horizun-mcp-package
          path: |
            dist/*setup.exe
            dist/sbom.json
            dist/package-hashes.json
            dist/SHA256SUMS.txt
            dist/stage.zip
            dist/stage/manifest.json

  # The release's stated trust state is re-evaluated on a disposable
  # Microsoft-hosted machine. For 0.x every own binary must be honestly unsigned.
  # From 1.0 onward every own binary must be publicly trusted and timestamped.
  public-signature:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download the exact signed package
        uses: actions/download-artifact@v4
        with:
          name: horizun-mcp-package
          path: dist

      - name: Enforce the versioned trust promise on a clean runner
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath dist/stage.zip -DestinationPath dist/stage -Force
          . ./scripts/horizun-deploy.lib.ps1
          $targets = @(@(Get-HorizunOwnBinaries 'dist/stage') | ForEach-Object { Get-Item $_ }) + `
                     @(Get-ChildItem dist -Filter '*setup.exe' -File)
          if ($targets.Count -ne 8) {
            throw "Expected server exe+dll, five Revit DLLs and setup; found $($targets.Count)."
          }
          $major = ([version]('${{ github.ref_name }}'.TrimStart('v'))).Major
          if ($major -lt 1) {
            foreach ($file in $targets) {
              $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
              if ($sig.Status -ne 'NotSigned') {
                throw "$($file.FullName) does not match the 0.x unsigned disclosure: $($sig.Status) - $($sig.StatusMessage)"
              }
              Write-Host "  disclosed unsigned $($file.Name)"
            }
            Write-Host '::warning::Horizun 0.x is distributed without a publicly trusted publisher. Verify SHA256SUMS.txt before running Setup.'
            exit 0
          }
          foreach ($file in $targets) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($sig.Status -ne 'Valid') {
              throw "$($file.FullName) is not publicly trusted on a clean Windows runner: $($sig.Status) - $($sig.StatusMessage)"
            }
            if (-not $sig.TimeStamperCertificate) {
              throw "$($file.FullName) has no trusted Authenticode timestamp."
            }
            if ($sig.SignerCertificate.Subject -eq $sig.SignerCertificate.Issuer) {
              throw "$($file.FullName) is self-signed, not a public publisher identity."
            }
            Write-Host "  trusted $($file.Name) - $($sig.SignerCertificate.Subject)"
          }

  # ---------------------------------------------------------------------------
  # Install exactly once. Reinstalling the identical package before every Revit
  # year adds no evidence and creates a false dependency on unrelated MCP clients
  # staying closed for the whole matrix. The immutable installed payload is
  # proven here; the next job exercises it in each supported Revit API.
  # ---------------------------------------------------------------------------
  install-package:
    if: ${{ vars.HAS_REVIT_RUNNER == 'true' }}
    needs: package
    runs-on: [self-hosted, windows, revit]
    steps:
      - uses: actions/checkout@v7

      # DOWNLOAD THE ARTIFACT. This job used to read dist/ straight off the runner
      # and call it "the packaged artifact". On a self-hosted runner that directory
      # is whatever the previous job happened to leave in the workspace: an
      # installer from an earlier run, a dist/ that checkout did not clean, or -
      # when the package job runs on a different machine from this one - nothing at
      # all. The job that exists to prove the SHIPPED package works was testing a
      # directory, and on a good day the two were the same thing.
      - name: Get the package this run built
        uses: actions/download-artifact@v4
        with:
          name: horizun-mcp-package
          path: dist

      # AND PROVE IT IS THAT ONE. A download is a network operation; it can hand
      # back a truncated file or, with a name collision across runs, somebody
      # else's. Every hash the package job recorded is re-checked here, before the
      # installer is executed - which is the last moment checking is cheap.
      - name: Verify the downloaded package is byte-for-byte the one that was built
        shell: pwsh
        run: |
          $hashFile = 'dist/package-hashes.json'
          if (-not (Test-Path $hashFile)) {
            throw "the artifact carries no package-hashes.json, so there is no way to tell whether what was downloaded is what was built. Refusing to install it."
          }
          $rec = Get-Content $hashFile -Raw | ConvertFrom-Json

          # The artifact must be from THIS run's commit. A cached artifact from an
          # earlier commit would install cleanly and be verified against its own
          # manifest, and every check downstream would pass about the wrong build.
          if ($rec.workflow_sha -ne "${{ github.sha }}") {
            throw "this artifact was built from ${{ github.sha }}'s workflow? no: it records $($rec.workflow_sha), and this run is ${{ github.sha }}. It is from a different run."
          }

          $setup = Get-ChildItem dist -Filter '*setup.exe' -File | Select-Object -First 1
          if (-not $setup) { throw "the downloaded artifact contains no installer" }

          $onDisk = @{
            'installer'     = $setup.FullName
            'sbom.json'     = 'dist/sbom.json'
            'manifest.json' = 'dist/stage/manifest.json'
            'stage.zip'     = 'dist/stage.zip'
            'SHA256SUMS.txt'= 'dist/SHA256SUMS.txt'
          }
          $wrong = @()
          foreach ($k in $onDisk.Keys) {
            $expected = $rec.files.$k
            if (-not $expected) { $wrong += "$k : the package recorded no hash for it"; continue }
            if (-not (Test-Path $onDisk[$k])) { $wrong += "$k : missing from the download"; continue }
            $actual = (Get-FileHash $onDisk[$k] -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected.sha256) { $wrong += "$k : $actual, built as $($expected.sha256)" }
            else { Write-Host "  ok  $k  $($actual.Substring(0,16))..." }
          }
          if ($wrong.Count -gt 0) {
            throw "the downloaded package does not match what was built:`n  - $($wrong -join "`n  - ")"
          }
          Write-Host "the package is byte-for-byte the one built from commit $($rec.commit)"

      - name: Restore the complete staged payload and its build timestamps
        shell: pwsh
        run: |
          $archive = (Resolve-Path 'dist/stage.zip').Path
          $destination = Join-Path (Resolve-Path 'dist').Path 'stage'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          if (-not (Test-Path 'dist/stage/server/horizun-mcp.exe')) {
            throw 'stage.zip did not restore the server payload'
          }

      # THE INSTALLED ARTIFACT, NOT bin/Release.
      #
      # This job used to run verify-live with its default -Server, which pointed
      # at src/.../bin/Release. So the integration suite proved the developer
      # build worked and said nothing about the package anybody installs - which
      # is the only build a release is about. verify-live now refuses a
      # bin/Release path unless told to, and this installs the real thing first.
      - name: Install the packaged artifact
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "no installer was produced by the package job" }
          Write-Host "installing $($setup.Name)"
          # LOCAL, because that is what the installer stamps - Inno's
          # GetDateTimeString has no UTC form. The first version of this compared
          # a local stamp against a UTC clock and rejected a good install as
          # stale on any machine not on UTC.
          $startedLocal = Get-Date
          $result = Join-Path $env:RUNNER_TEMP "horizun-install-result-${{ github.run_id }}.txt"
          # CI validates the installed artifact directly. It must never discover
          # or rewrite a maintainer's personal Claude/Codex configuration on the
          # self-hosted release runner.
          $p = Start-Process $setup.FullName -ArgumentList '/SILENT','/SUPPRESSMSGBOXES','/NORESTART','/HORIZUNCLIENT=None',"/HORIZUNRESULT=$result" -Wait -PassThru

          # BOTH, and neither alone. Inno returns 0 from any install that
          # COMPLETES - including one where a year failed and was rolled back -
          # so 0 does not mean fully installed. But a NON-ZERO code means Setup
          # never completed, and then install-result.txt is whatever the previous
          # run left behind.
          #
          # Measured on 2026-07-30: a silent install exited 1 having deployed
          # NOTHING, and the four-hour-old result file in {app} still said
          # fully_installed=yes. The first version of this step read only that
          # file and would have called it a success.
          if ($p.ExitCode -ne 0) { throw "Setup did not complete: exit code $($p.ExitCode). Nothing can be concluded from install-result.txt - it is from an earlier run." }

          if (-not (Test-Path $result)) { throw "the installer left no install-result.txt" }
          Get-Content $result | Write-Host

          $text = Get-Content $result -Raw
          if ($text -notmatch 'installed_local\s*=\s*(\S+ \S+)') { throw "install-result.txt has no installed_local - it predates this installer and its freshness cannot be checked" }
          $stamp = [datetime]::ParseExact($Matches[1], 'yyyy-MM-dd HH:mm:ss', $null)
          if ($stamp -lt $startedLocal.AddMinutes(-5)) { throw "install-result.txt is STALE ($stamp local, this run started $startedLocal local) - it is from an earlier install" }
          if ($text -notmatch 'server_installed\s*=\s*yes') { throw "the server was not installed" }
          if ($text -notmatch 'any_revit_found\s*=\s*yes') { throw "no Revit installation was found" }
          # Horizontal whitespace only. \s also consumes the newline after an
          # empty `failed=` and then mistakes the next key (`fully_installed`)
          # for a failed year; a completely green install was measured doing so.
          if ($text -match '(?m)^failed[ \t]*=[ \t]*\S') { throw "one or more Revit payloads failed" }
          if ($text -notmatch 'fully_installed\s*=\s*yes') { throw "the install was PARTIAL - see install-result.txt above" }

      # The chain, end to end: source commit -> manifest -> stage -> installed.
      # Hashes prove identity; the commit stamped into each binary proves
      # provenance. Neither alone answers "is everything installed one clean
      # commit, and is it the one in the tree".
      - name: Verify one clean commit from source to what is installed
        shell: pwsh
        # Branch builds and disclosed 0.x releases keep the explicit unsigned
        # exception. From 1.0 onward the installed artifact must be publicly signed.
        # The result path is the exact per-run file requested in the install step,
        # never the global result left by an earlier install.
        run: |
          $requiresPublicSignature = '${{ startsWith(github.ref, 'refs/tags/v') }}' -eq 'true' -and `
            ([version]('${{ github.ref_name }}'.TrimStart('v'))).Major -ge 1
          if ($requiresPublicSignature) {
            pwsh scripts/verify-release.ps1 -Installed -InstallResult "$env:RUNNER_TEMP/horizun-install-result-${{ github.run_id }}.txt" -Json artifacts/live/release-chain.json
          } else {
            pwsh scripts/verify-release.ps1 -Installed -AllowUnsigned -InstallResult "$env:RUNNER_TEMP/horizun-install-result-${{ github.run_id }}.txt" -Json artifacts/live/release-chain.json
          }

      - name: Publish the installed release-chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: installed-release-chain
          # Every live job starts from a clean checkout. The orchestrator needs
          # this manifest to bind the installed server and selected add-in year
          # to the package commit before it opens Revit.
          path: |
            artifacts/live/release-chain.json
            dist/stage/manifest.json

  # ---------------------------------------------------------------------------
  # The integration suite: real commands against real disposable models. Every
  # year consumes the one package install proven above; compilation alone is not
  # a substitute for opening the payload in that Revit API.
  # ---------------------------------------------------------------------------
  revit-integration:
    if: ${{ vars.HAS_REVIT_RUNNER == 'true' }}
    needs: install-package
    runs-on: [self-hosted, windows, revit]
    strategy:
      fail-fast: false
      # This matrix shares one interactive Windows desktop. Two simultaneous
      # Revit sessions would make target selection ambiguous and invalidate both
      # reports, even if more runner slots are added later.
      max-parallel: 1
      matrix:
        year: [2023, 2024, 2025, 2026, 2027]
    steps:
      - uses: actions/checkout@v7

      - name: Get the proven install manifest
        uses: actions/download-artifact@v4
        with:
          name: installed-release-chain
          path: .

      - name: Live verification against a running Revit ${{ matrix.year }}
        shell: pwsh
        # This owns the whole lifecycle. Merely invoking verify-live.ps1 does not
        # start Revit, open fixtures, close a workset or opt into the committing
        # tier; without those steps a green-looking job cannot be release evidence.
        run: pwsh scripts/run-release-live-gate.ps1 -Year ${{ matrix.year }} -Json "artifacts/live/live-${{ matrix.year }}.json"

      # always(), because the JSON of a FAILED run is the artifact somebody
      # actually needs. Publishing only the green ones is publishing nothing.
      - name: Publish the live-verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-verification-${{ matrix.year }}
          path: artifacts/live

  # A stable tag gets one matrix artifact that is mechanically complete. The
  # release job consumes this artifact; it cannot substitute a skipped year or
  # an old local report.
  stable-release-evidence:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: revit-integration
    runs-on: ubuntu-latest
    steps:
      - name: Download every live report from this run
        uses: actions/download-artifact@v4
        with:
          pattern: live-verification-*
          path: live
          merge-multiple: true

      - name: Require a clean release-gate report for all five years
        shell: pwsh
        run: |
          foreach ($year in 2023,2024,2025,2026,2027) {
            $path = "live/live-$year.json"
            if (-not (Test-Path $path)) { throw "missing published live report for Revit $year" }
            $doc = Get-Content $path -Raw | ConvertFrom-Json
            if (-not $doc.release_gate -or $doc.revit_year -ne $year) { throw "$path is not this year's release-gate report" }
            if ($doc.summary.failed -ne 0 -or $doc.summary.unverified -ne 0 -or $doc.summary.not_covered -ne 0) {
              throw "$path is incomplete: $($doc.summary | ConvertTo-Json -Compress)"
            }
          }

      - name: Publish the complete stable matrix
        uses: actions/upload-artifact@v4
        with:
          name: stable-live-matrix-${{ github.ref_name }}
          path: live/live-*.json

  publish-stable-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'HorizunGroup/horizun-revit-mcp'
    needs: [package, public-signature, stable-release-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the exact package from this run
        uses: actions/download-artifact@v4
        with:
          name: horizun-mcp-package
          path: release

      - name: Download the complete live matrix from this run
        uses: actions/download-artifact@v4
        with:
          name: stable-live-matrix-${{ github.ref_name }}
          path: release/live

      - name: Create or complete the stable GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*setup.exe release/SHA256SUMS.txt release/sbom.json release/package-hashes.json release/stage/manifest.json release/live/live-*.json)
          if [ "${#files[@]}" -ne 10 ]; then
            printf 'Expected installer + 4 metadata files + 5 live reports; found %s\n' "${#files[@]}" >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --latest --prerelease=false --draft=false
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --generate-notes --latest --title "Horizun Revit MCP $GITHUB_REF_NAME"
          fi

  publish-mcp-registry:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'HorizunGroup/horizun-revit-mcp'
    needs: publish-stable-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Generate registry metadata from the canonical version
        shell: pwsh
        run: pwsh scripts/generate-mcp-manifest.ps1 -OutFile .mcp/server.json

      - name: Install the pinned official MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz'
          expected='1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf'
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output mcp-publisher.tar.gz
          echo "$expected  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate .mcp/server.json

      - name: Authenticate and publish official registry metadata
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish .mcp/server.json

  # ---------------------------------------------------------------------------
  # Says out loud what did not run. Without this, a green run looks complete.
  # ---------------------------------------------------------------------------
  coverage-statement:
    if: ${{ always() }}
    needs: [revit-free]
    runs-on: ubuntu-latest
    steps:
      - name: What this run did and did not cover
        run: |
          echo "Proved here: the MCP server, the honesty arithmetic, coverage rules,"
          echo "request ownership, the wire protocol, contract drift and multi-instance discovery."
          echo "Also here: the structural half of the sensitive-name scan. The NAME half needs"
          echo "a wordlist that is deliberately not in this repository, so on a hosted runner it"
          echo "reports NOT RUN - which is not the same as passing, and is not printed as if it were."
          if [ "${{ vars.HAS_REVIT_RUNNER }}" = "true" ]; then
            echo "Revit jobs: RAN (a self-hosted runner with Revit is configured)."
            echo "Integration ran against the INSTALLED artifact on Revit 2023 through 2027, with the"
            echo "commit and full SHA-256 of the server and that year's add-in checked against the"
            echo "release manifest. NOT COVERED exits 3 under -ReleaseGate."
          else
            echo "::warning::Revit jobs were SKIPPED - no self-hosted runner with Revit is configured."
            echo "NOT covered by this run: the add-in for any year, packaging, the installer,"
            echo "and every command that touches a model. Those are verified on a developer"
            echo "machine with Revit, and that verification is not represented by this tick."
          fi
